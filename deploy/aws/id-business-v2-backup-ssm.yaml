AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 backups and SSM access for the ID Business V2 production EC2 instance.

Parameters:
  BackupPrefix:
    Type: String
    Default: mysql/daily
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'
    Description: S3 key prefix used by the MySQL backup job.

Resources:
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'id-business-v2-backups-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: RetainDailyBackups
            Status: Enabled
            Prefix: !Sub '${BackupPrefix}/'
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt BackupBucket.Arn
              - !Sub '${BackupBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: DenyIncorrectEncryptionHeader
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${BackupBucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: AES256

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'id-business-v2-ec2-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: MySqlBackupBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadBucketLocation
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                Resource: !GetAtt BackupBucket.Arn
              - Sid: ListBackupPrefix
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt BackupBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub '${BackupPrefix}/*'
              - Sid: ReadWriteBackupObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${BackupBucket.Arn}/${BackupPrefix}/*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub 'id-business-v2-ec2-${AWS::Region}'
      Roles:
        - !Ref InstanceRole

Outputs:
  BackupBucketName:
    Description: Private encrypted backup bucket.
    Value: !Ref BackupBucket
  BackupPrefix:
    Description: Allowed object prefix.
    Value: !Ref BackupPrefix
  InstanceProfileName:
    Description: Instance profile to associate with the production EC2 instance.
    Value: !Ref InstanceProfile
  InstanceRoleArn:
    Description: IAM role used by EC2 for SSM and S3 backup access.
    Value: !GetAtt InstanceRole.Arn
