services:
  postgres:
    image: postgres:16-alpine
    container_name: apple-business-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: id_business_v2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d id_business_v2']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
