<!doctype html>
<html lang="zh-CN">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>业务监控 · 响应式验收</title>
    <style>

  <body>

      id="preview"
      title="业务监控响应式验收"

    <script>
      const requestedWidth = Number(new URLSearchParams(window.location.search).get('width'));
      const width = requestedWidth === 901 ? 901 : 390;
      document.querySelector('#preview').style.width = `${width}px`;
    </script>
  </body>
