<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ID 业务管理</title>
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem('id-business-v2-theme');
          const theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : 'light';
          document.documentElement.dataset.v2Theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.v2Theme = 'light';
          document.documentElement.style.colorScheme = 'light';
        }

        window.__V2_APP_MOUNTED__ = false;
        window.addEventListener('vite:preloadError', (event) => {
          if (window.__V2_APP_MOUNTED__) return;
          event.preventDefault();

          const buildId =
            document.querySelector('meta[name="v2-build-id"]')?.getAttribute('content') ||
            'unknown-build';
          let alreadyReloaded = true;
          try {
            const storageKey = 'apple-business:v2-preload-reload-build';
            alreadyReloaded = sessionStorage.getItem(storageKey) === buildId;
            if (!alreadyReloaded) sessionStorage.setItem(storageKey, buildId);
          } catch {
            alreadyReloaded = true;
          }

          if (!alreadyReloaded) {
            location.reload();
            return;
          }

          const status = document.querySelector('.v2-boot__status');
          const retry = document.querySelector('.v2-boot__retry');
          if (status) {
            status.textContent = '页面资源仍未加载成功，请检查网络后重试。';
            status.hidden = false;
          }
          if (retry) retry.hidden = false;
        });

        window.setTimeout(() => {
          if (window.__V2_APP_MOUNTED__) return;
          const status = document.querySelector('.v2-boot__status');
          if (status) {
            status.textContent = '正在启动';
            status.hidden = false;
          }
        }, 600);

        window.setTimeout(() => {
          if (window.__V2_APP_MOUNTED__) return;
          const retry = document.querySelector('.v2-boot__retry');
          if (retry) retry.hidden = false;
        }, 12000);
      })();
    </script>
    <style>
      :root {
        --boot-font-sans:
          'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont,
          'Segoe UI', sans-serif;
        --boot-bg: #f5f7fa;
        --boot-surface: #ffffff;
        --boot-text: #172033;
        --boot-text-soft: #66748a;
        --boot-border: #dce3ec;
        --boot-primary: #2563eb;
      }
      html[data-v2-theme='dark'] {
        --boot-bg: #0d1118;
        --boot-surface: #141a23;
        --boot-text: #edf2f8;
        --boot-text-soft: #9ba8b9;
        --boot-border: #2a3443;
        --boot-primary: #4f83f3;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
      }
      body {
        background: var(--boot-bg);
        color: var(--boot-text);
        font-family: var(--boot-font-sans);
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .v2-boot {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        padding: 24px;
      }
      .v2-boot__panel {
        display: grid;
        width: min(100%, 420px);
        justify-items: center;
        gap: 18px;
        padding: 40px 34px;
        border: 1px solid var(--boot-border);
        border-radius: 12px;
        background: var(--boot-surface);
        text-align: center;
      }
      .v2-boot__mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 9px;
        background: var(--boot-primary);
        color: #fff;
        font-weight: 800;
      }
      .v2-boot__status {
        margin: 0;
        color: var(--boot-text-soft);
      }
      .v2-boot__progress {
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--boot-border);
      }
      .v2-boot__progress::after {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        animation: v2-boot-progress 1s ease-in-out infinite alternate;
        background: var(--boot-primary);
        content: '';
      }
      .v2-boot__retry {
        min-height: 38px;
        padding: 0 16px;
        border: 0;
        border-radius: 6px;
        background: var(--boot-primary);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
      }
      @keyframes v2-boot-progress {
        from {
          transform: translateX(-70%);
        }
        to {
          transform: translateX(120%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .v2-boot__progress::after {
          animation: none;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main class="v2-boot">
        <section class="v2-boot__panel" role="status" aria-live="polite">
          <span class="v2-boot__mark" aria-hidden="true">ID</span>
          <p class="v2-boot__status" hidden></p>
          <span class="v2-boot__progress" aria-hidden="true"></span>
          <button class="v2-boot__retry" type="button" hidden onclick="location.reload()">
            重新加载
          </button>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
