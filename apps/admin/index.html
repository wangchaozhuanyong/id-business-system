<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/v2-boot.css" />
    <title>ID 业务管理</title>
    <script src="/v2-boot.js"></script>
  </head>
  <body>
    <div id="app">
      <main class="v2-boot">
        <section class="v2-boot__panel" aria-busy="true">
          <span class="v2-boot__mark" aria-hidden="true">ID</span>
          <div class="v2-boot__copy" role="status" aria-live="polite">
            <strong>正在安全打开页面</strong>
            <p class="v2-boot__status">正在核验身份并准备页面，请稍候。</p>
          </div>
          <span class="v2-boot__progress" aria-hidden="true"></span>
          <button class="v2-boot__retry" type="button" hidden>重新加载</button>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
