  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="主导航"></aside>
      <div class="sidebar-shade" id="sidebar-shade" hidden></div>
      <div class="workspace">
        <header class="topbar">
          <div class="topbar-left">
            <button
              class="icon-button"
              id="nav-toggle"
              aria-label="展开或收起导航"
              aria-expanded="true"
            ></button>
            <div class="topbar-context">
              <nav class="breadcrumbs" id="breadcrumbs" aria-label="所属栏目"></nav>
              <div class="topbar-page-title" id="page-title"></div>
            </div>
          </div>
          <nav class="topbar-tools" aria-label="常用工具">
            <button type="button" class="button quiet" data-action="tools-open" data-tab="个人工具" aria-haspopup="dialog" aria-controls="drawer">个人工具</button>
            <button type="button" class="button quiet" data-action="tools-open" data-tab="在线工具" aria-haspopup="dialog" aria-controls="drawer">在线工具</button>
            <button type="button" class="button quiet" data-action="tools-open" data-tab="话术文案" aria-haspopup="dialog" aria-controls="drawer">话术文案</button>
          </nav>
          <div class="topbar-actions">
            <button type="button" class="button quiet mobile-tools-toggle" id="mobile-tools-toggle" popovertarget="mobile-tools-panel" aria-label="工具与界面设置">工具</button>
            <details class="interaction-preferences" id="interaction-preferences">
              <summary aria-label="界面音效设置" aria-controls="sound-settings" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4 6 8H3v8h3l5 4z"/><path class="sound-off-mark" d="M16 9l5 6m0-6-5 6"/><path class="sound-on-mark" d="M16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg><span data-sound-label>音效关</span></summary>
              <div id="sound-settings" class="interaction-preferences-panel" popover="manual">
                <strong>交互音效</strong>
                <label><input id="sound-enabled" type="checkbox" />开启轻音效</label>
                <label for="sound-volume">音量 <output id="sound-volume-label">15%</output></label>
                <input id="sound-volume" type="range" min="0" max="30" value="15" aria-label="交互音效音量" />
                <p id="sound-state" role="status">默认静音，仅在本次会话开启。</p>
              </div>
            </details>
            <button
              class="prototype-label"
              type="button"
              data-action="preview-states"
              title="查看加载、失败、空数据等设计状态"
            >
              <i></i>交互原型 · 状态预览
            </button>
            <button class="icon-button" id="theme-toggle" aria-label="切换为深色主题"></button>
            <span class="topbar-divider"></span>
            <button class="profile-button" id="profile-button" aria-label="查看演示账户">
              <span class="avatar">林</span><span class="profile-name">林管理员</span>
            </button>
          </div>
        </header>
        <main id="main" tabindex="-1" aria-labelledby="page-title-heading"></main>
        <footer class="workspace-footer">
          <span>ID 业务管理系统</span
          ><span>北京时间（UTC+8） · 页面设计预览 · 所有资料均为虚构示例</span>
        </footer>
      </div>
    </div>
    <dialog id="drawer" class="drawer" aria-labelledby="drawer-title"></dialog>
    <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title"></dialog>
    <div id="mobile-tools-panel" class="mobile-tools-panel" popover="auto" aria-label="工具与界面设置"></div>
    <div id="mobile-entry-actions" class="mobile-entry-actions" hidden></div>
    <div class="toast" id="toast" popover="manual" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  </body>
</html>
