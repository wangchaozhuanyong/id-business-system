<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>站内手动充值</title>
  <link rel="stylesheet" href="/assets/native-workbench/prototype.css?v=20261127-manual-recharge">
</head>
<body class="proto-body">
  <main class="proto-layout">
    <form class="proto-sidebar proto-card" id="protoLaunchForm" autocomplete="off">
      <h1 class="proto-title">站内手动充值</h1>
      <label for="protoJsonInput">ChatGPT 授权 JSON</label>
      <textarea id="protoJsonInput" class="proto-textarea" rows="4" maxlength="65000"
        placeholder="粘贴完整的 ChatGPT 单账号授权 JSON" autocomplete="off" spellcheck="false"
        data-no-draft aria-describedby="protoJsonStatus" required></textarea>
      <div class="proto-parse-row">
        <span>账号邮箱</span>
        <strong id="protoParsedEmail" aria-live="polite">—</strong>
      </div>
      <p id="protoJsonStatus" class="proto-field-status" role="status" hidden></p>
      <label for="protoRegionSelect">执行 IP</label>
      <select id="protoRegionSelect" class="proto-select" required disabled>
        <option value="">正在读取 IP 线路…</option>
      </select>
      <label for="protoProxyInput" id="protoProxyInputLabel" hidden>HTTP 代理地址</label>
      <input id="protoProxyInput" class="proto-input" type="password"
        placeholder="主机:端口或完整 HTTP 代理地址" autocomplete="off" spellcheck="false" data-no-draft hidden>
      <div class="proto-btn-row">
        <button type="submit" id="protoLaunchBtn" class="proto-btn proto-btn-primary" disabled>提交并打开操作窗</button>
        <button type="button" id="protoClearBtn" class="proto-btn">清空 JSON</button>
        <button type="button" id="protoReloadIps" class="proto-btn" hidden>重新读取 IP</button>
      </div>
      <p id="protoMessage" class="proto-message" role="status" hidden></p>
    </form>

    <section class="proto-stage" aria-label="ChatGPT 手动充值操作窗" hidden>
      <div class="proto-status-bar">
        <span id="protoProxyBadge" class="proto-pill proto-pill-muted">出口 IP 待核验</span>
        <span id="protoLoginBadge" class="proto-pill proto-pill-muted">账号登录待核验</span>
      </div>
      <div class="proto-toolbar">
        <div class="proto-nav-btns">
          <button type="button" id="protoBackBtn" class="proto-btn proto-btn-sm" disabled title="后退">←</button>
          <button type="button" id="protoReloadBtn" class="proto-btn proto-btn-sm" disabled title="刷新">↻</button>
        </div>
        <form id="protoUrlForm" class="proto-url-form">
          <input id="protoUrlInput" class="proto-input proto-url-input" type="url" value="https://chatgpt.com/" disabled>
          <button type="submit" id="protoGoBtn" class="proto-btn proto-btn-sm" disabled>前往</button>
        </form>
        <div class="proto-stage-actions">
          <button type="button" id="protoRecheckBtn" class="proto-btn proto-btn-sm" disabled>重新核验登录</button>
          <button type="button" id="protoCloseBtn" class="proto-btn proto-btn-danger proto-btn-sm" disabled>关闭浏览器</button>
        </div>
      </div>

      <div class="proto-paste-bar">
        <input
          id="protoSendTextInput"
          class="proto-input"
          type="text"
          placeholder="先在画面内选中输入框，再在这里粘贴文本" autocomplete="off" data-no-draft
          disabled
        >
        <button type="button" id="protoSendTextBtn" class="proto-btn proto-btn-secondary proto-btn-sm" disabled>
          发送文本
        </button>
      </div>

      <div class="proto-canvas-wrap" id="protoCanvasWrap">
        <canvas id="protoCanvas" width="1280" height="800" tabindex="0"></canvas>
        <div id="protoEmptyOverlay" class="proto-overlay">
          <div class="proto-overlay-inner">
            <p class="proto-overlay-title">正在连接站内操作窗</p>
            <p class="proto-overlay-sub">等待浏览器画面。</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/assets/native-workbench/prototype.mjs?v=20261127-manual-recharge"></script>
</body>
</html>
