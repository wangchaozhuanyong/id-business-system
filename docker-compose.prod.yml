x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: '${DOCKER_LOG_MAX_FILE:-10}'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ${PROD_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?set Supabase DATABASE_URL}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_TITLE: ${VITE_APP_TITLE:-ID 业务管理系统}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - '${ADMIN_HTTP_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
