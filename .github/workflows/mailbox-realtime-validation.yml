name: Mailbox Realtime Repair Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed main commit
        required: true
        type: string
      expected_current:
        description: Exact independently verified deployed predecessor
        required: true
        type: string
      capture_only:
        description: Read-only runtime evidence after the published account successor
        default: false
        required: true
        type: boolean
      publish:
        description: Publish after isolated validation
        default: false
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: id-business-v2-production-release
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ !inputs.capture_only && github.ref == 'refs/heads/main' && inputs.commit == github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      MAILBOX_REALTIME_20261016: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Verify finite publication and preservation controls
        run: python3 -B scripts/production-release/mailbox-realtime-release.test.py
      - name: Reconstruct exact deployed sources and the reviewed delta
        run: python3 -B scripts/production-release/mailbox-realtime-build.py prepare
      - name: Install isolated browser runtime
        working-directory: .deploy/mailbox-realtime/candidate
        run: npx playwright install --with-deps chromium
      - name: Reproduce published API Admin and compile the mailbox delta
        run: python3 -B scripts/production-release/mailbox-realtime-build.py build
      - name: Verify mailbox recovery queries health and offline browser scenarios
        run: python3 -B scripts/production-release/mailbox-realtime-build.py validate
      - name: Package only the verified no-migration delta
        run: python3 -B scripts/production-release/mailbox-realtime-build.py package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mailbox-realtime-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .deploy/mailbox-realtime/mailbox-realtime-artifact.tar.gz
            .deploy/mailbox-realtime/artifact-sha256.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: validate
    if: ${{ !inputs.capture_only && inputs.publish && github.ref == 'refs/heads/main' && inputs.commit == github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_REGION: ap-northeast-1
      RELEASE_COMMIT: ${{ inputs.commit }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
      MAILBOX_REALTIME_20261016: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Configure existing production OIDC role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::079740175286:role/id-business-v2-github-release
          role-session-name: id-business-v2-registration-parity-${{ github.run_id }}
          aws-region: ap-northeast-1
          role-duration-seconds: 3600
      - name: Publish once and independently read back
        run: python3 -B scripts/production-release/mailbox-realtime-dispatch.py
      - name: Preserve native publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mailbox-realtime-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/mailbox-realtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  inspect:
    if: inputs.capture_only && !inputs.publish && github.ref == 'refs/heads/main' && inputs.commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::079740175286:role/id-business-v2-github-release
          role-session-name: id-business-v2-mailbox-readonly-${{ github.run_id }}
          aws-region: ap-northeast-1
          role-duration-seconds: 900
      - name: Capture only runtime hashes and preservation metadata
        run: python3 -B scripts/production-release/mailbox-realtime-inspect.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mailbox-runtime-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/mailbox-runtime-inspection/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
