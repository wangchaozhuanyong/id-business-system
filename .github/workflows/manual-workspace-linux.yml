name: Manual renewal workspace on x86 Linux

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/manual-workspace-linux.yml'
      - 'deploy/manual-desktop/**'
      - 'server/access-roles.mjs'
      - 'server/manual-*.mjs'
      - 'test/manual-renewal-roles.integration.mjs'
      - 'test/manual-remote-desktop-linux/**'

permissions:
  contents: read

jobs:
  amazon-linux-prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare and verify signed packages in the Amazon Linux 2023 base image
        shell: bash
        run: |
          set -euo pipefail
          # Docker Official Image, Amazon Linux 2023.12.20261120.0, linux/amd64.
          image=amazonlinux@sha256:8ba7eb1e9aa2747ad5206f5f53ad1dfc03fa9f5fb69b7a7dcd95cbc2ade3bd97
          docker run --rm --platform linux/amd64 --security-opt no-new-privileges \
            --pids-limit 128 --memory 1536m --env AWS_EC2_METADATA_DISABLED=true \
            --mount "type=bind,src=$GITHUB_WORKSPACE/deploy/manual-desktop/host,dst=/fixture/host,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/test/manual-remote-desktop-linux/amazon-linux-prepare.py,dst=/fixture/check.py,readonly" \
            "$image" /usr/bin/python3 -IB /fixture/check.py

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.22.1'
      - name: Verify real platform sessions with isolated business records
        run: node --test test/manual-renewal-roles.integration.mjs
      - name: Verify the isolated browser container and its memory limit
        run: bash test/manual-remote-desktop-linux/container-check.sh --host-fixture
