name: Manual renewal workspace on x86 Linux

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/manual-workspace-linux.yml'
      - 'deploy/manual-desktop/**'
      - 'server/access-roles.mjs'
      - 'server/manual-*.mjs'
      - 'test/manual-renewal-roles.integration.mjs'
      - 'test/manual-remote-desktop-linux/**'

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.22.1'
      - name: Verify real platform sessions with isolated business records
        run: node --test test/manual-renewal-roles.integration.mjs
      - name: Verify the isolated browser container and its memory limit
        run: bash test/manual-remote-desktop-linux/container-check.sh
