name: Online Settings Release Validation

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed main commit to validate and package
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: online-settings-ci-fixture
          MYSQL_DATABASE: id_business_v2_online_recharge_fixture
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ponline-settings-ci-fixture"
          --health-interval=5s --health-timeout=5s --health-retries=24
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:online-settings-ci-fixture@127.0.0.1:3306/id_business_v2_online_recharge_fixture
      FIELD_ENCRYPTION_KEY: synthetic-settings-ci-encryption
      HASH_SECRET: synthetic-settings-ci-index
      ONLINE_RECHARGE_WORKER_KEY: synthetic-settings-ci-worker-key-32-characters
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prisma:mysql:generate
      - run: npm run build --workspace @apple-business/shared
      - name: Apply migrations only to disposable CI MySQL
        run: npm run prisma:mysql:migrate:deploy
      - name: Verify real soft delete, task snapshots and routing transactions
        env:
          ONLINE_RECHARGE_MYSQL_TEST: '1'
        run: |
          mkdir -p .deploy/online-settings-mysql
          npm run test --workspace @apple-business/api -- src/id-business-v2/online-recharge/mysql.integration.spec.ts --reporter=default --reporter=json --outputFile=$GITHUB_WORKSPACE/.deploy/online-settings-mysql/results.json
      - name: Build only reviewed payload over reproduced published sources
        env:
          NODE_ENV: production
        run: python3 -B scripts/production-release/online-settings-build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: online-settings-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .deploy/online-settings-release/online-settings-artifact.tar.gz
            .deploy/online-settings-release/artifact-sha256.txt
            .deploy/online-settings-mysql/results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
