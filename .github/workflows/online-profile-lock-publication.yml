name: Online Recharge Profile Lock Recovery

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish the reviewed candidate or retrieve the accepted incident diagnostic
        required: true
        default: publish
        type: choice
        options:
          - publish
          - read_original_diagnostic
      commit:
        description: Exact reviewed main commit
        required: true
        type: string
      expected_current:
        description: Exact deployed predecessor
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: id-business-v2-production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha && inputs.operation == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Verify finite source and publication adapter
        run: |
          git fetch --no-tags origin refs/pull/717/head
          python3 -B scripts/production-release/online-profile-lock-publication.py check
          python3 -B scripts/production-release/online-profile-lock-release.test.py
      - name: Configure existing production observation role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::098208446664:role/id-business-v2-github-release
          role-session-name: id-business-v2-profile-lock-observe-${{ github.run_id }}
          aws-region: ap-northeast-1
      - name: Authenticate source checks and package the reviewed host control files
        run: python3 -B scripts/production-release/online-profile-lock-publication.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: online-profile-lock-native-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .deploy/online-profile-lock/online-profile-lock-artifact.tar.gz
            .deploy/online-profile-lock/artifact-sha256.txt
          include-hidden-files: true
          if-no-files-found: error
      - name: Preserve original observation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: online-profile-lock-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/online-profile-lock/*.json
          include-hidden-files: true
          if-no-files-found: warn

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha && inputs.operation == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Configure existing production release role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::098208446664:role/id-business-v2-github-release
          role-session-name: id-business-v2-profile-lock-publish-${{ github.run_id }}
          aws-region: ap-northeast-1
      - name: Publish once and independently read back
        run: python3 -B scripts/production-release/online-profile-lock-publication.py publish
      - name: Preserve original release receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: online-profile-lock-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .deploy/online-profile-lock/*.json
            .deploy/online-profile-lock/artifact-notes.md
          include-hidden-files: true
          if-no-files-found: warn

  original-diagnostic:
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha && inputs.operation == 'read_original_diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Assume existing role for the accepted read-only receipt
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::098208446664:role/id-business-v2-github-release
          role-session-name: id-business-v2-profile-lock-read-${{ github.run_id }}
          aws-region: ap-northeast-1
      - name: Read the original accepted diagnostic without executing another command
        run: |
          mkdir -p .deploy/online-profile-lock
          aws ssm get-command-invocation \
            --command-id 9fb9dfc0-01da-4053-9274-452d58d4e444 \
            --instance-id i-0838cebf64f0e2a89 \
            --output json > .deploy/online-profile-lock/original-switch-invocation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: online-profile-lock-original-diagnostic-${{ github.run_id }}
          path: .deploy/online-profile-lock/original-switch-invocation.json
          include-hidden-files: true
          if-no-files-found: error
