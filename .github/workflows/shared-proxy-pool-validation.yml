name: Shared Proxy Pool Publication Validation
on:
  push:
    branches: [codex/shared-proxy-pool-published-base-20261015]
permissions:
  contents: read
  actions: read
concurrency:
  group: shared-proxy-pool-publication-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      JWT_SECRET: synthetic-shared-proxy-ci-only
      FIELD_ENCRYPTION_KEY: synthetic-shared-proxy-field-key
      HASH_SECRET: synthetic-shared-proxy-hash-key
      V2_BUILD_ID: v2-${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Reuse native checks only for unchanged business inputs
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/shared-proxy-validation-reuse.mjs
      - run: npm ci --no-audit
      - run: npm run prisma:mysql:generate && npm run prisma:mysql:validate
      - run: npm run typecheck && npm run build
        env:
          NODE_ENV: production
      - name: Verify the seven V2 controls and affected source
        run: |
          for check in check:admin-ui check:v2-ui-language check:v2-color-contrast check:v2-table-standard check:v2-loading-standard check:v2-module-architecture check:v2-isolation check:v2-prisma-runtime-boundary check:v2-concurrency-standard; do npm run "$check"; done
          node scripts/shared-proxy-publication.mjs controls
          npm run test --workspace @apple-business/admin -- src/v2/features/auto-recharge src/v2/features/proxy-pool src/v2/features/online-recharge src/v2/features/registry.spec.ts src/v2/router/routes.spec.ts
      - name: Verify both recharge systems and the shared pool
        if: steps.reuse.outputs.verified != 'true'
        run: |
          npm run test --workspace @apple-business/admin -- src/v2/features/auto-recharge src/v2/features/proxy-pool src/v2/features/online-recharge src/v2/features/registry.spec.ts src/v2/router/routes.spec.ts
          npm run test --workspace @apple-business/api -- src/id-business-v2/auto-recharge src/id-business-v2/proxy-pool src/id-business-v2/online-recharge
          npm ci --prefix apps/api/src/id-business-v2/online-recharge/engine/upstream --ignore-scripts --no-audit --no-fund
          node apps/api/src/id-business-v2/online-recharge/engine/upstream/node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
          npm run test:online-recharge:engine
          npm run test:online-recharge:controls
      - name: Verify real migrations and repository operations on owned empty MySQL
        if: ${{ !cancelled() && steps.reuse.outputs.verified != 'true' }}
        run: |
          python3 -B scripts/ci-recharge-migration.py
          node scripts/acceptance-v2-shared-proxy-mysql.mjs
          npm run acceptance:v2-production-database-access
      - name: Verify preserved production diagnostics with shared proxy execution
        run: |
          npm ci --prefix apps/api/src/id-business-v2/online-recharge/engine/upstream --ignore-scripts --no-audit --no-fund
          cd apps/api/src/id-business-v2/online-recharge/engine
          node --test test/proxy-pool.test.cjs test/proxy-resolver.test.cjs test/regressions.test.cjs test/runtime-main.test.cjs
      - name: Verify changed acceptance controls
        run: |
          npx prettier --check scripts/acceptance-v2-online-recharge-ui.mjs scripts/shared-proxy-validation-reuse.mjs .github/workflows/shared-proxy-pool-validation.yml apps/api/src/id-business-v2/online-recharge/engine/task-runner.cjs apps/api/src/id-business-v2/online-recharge/engine/SOURCE_MANIFEST.json
          npx eslint scripts/acceptance-v2-online-recharge-ui.mjs scripts/shared-proxy-validation-reuse.mjs
          node --check scripts/acceptance-v2-online-recharge-ui.mjs
      - name: Verify actual routes with synthetic data
        if: ${{ !cancelled() }}
        run: |
          npx playwright install --with-deps chromium
          node scripts/acceptance-v2-recharge-proxies-ui.mjs --built
          npm run acceptance:v2-online-recharge-ui -- --quick
          npm run acceptance:v2-auto-recharge -- --built
      - name: Independently reproduce the published baseline and package the scoped overlay
        run: node scripts/shared-proxy-publication.mjs package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shared-proxy-publication-${{ github.sha }}
          path: |
            .runtime/shared-proxy-release/
            .runtime/shared-proxy-mysql/result.json
            .runtime/shared-proxy-pool-ui/
            .runtime/online-recharge/ui/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
