name: Quality Gate

on:
  push:
    branches:
      - main
    tags:
      - 'v2-production-*'
  pull_request:
  workflow_dispatch:
    inputs:
      build_production_images:
        description: Build and validate production images during this manual run
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v2-production-') && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v2-production-') }}

jobs:
  change-scope:
    runs-on: ubuntu-latest
    outputs:
      dependency_audit: ${{ steps.scope.outputs.dependency_audit }}
      production_images: ${{ steps.scope.outputs.production_images }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          MANUAL_BUILD_PRODUCTION_IMAGES: ${{ inputs.build_production_images || 'false' }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_REF" == refs/tags/v2-production-* ]]; then
            printf '' | node scripts/ci-change-scope.mjs
            exit 0
          fi

          base_sha="$BASE_SHA"
          if [[ ! "$base_sha" =~ ^[a-f0-9]{40}$ || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)"
          fi
          if [[ "$base_sha" =~ ^[a-f0-9]{40}$ ]]; then
            git diff --name-only "$base_sha" "$GITHUB_SHA" | node scripts/ci-change-scope.mjs
          else
            git show --format= --name-only "$GITHUB_SHA" | node scripts/ci-change-scope.mjs
          fi

  quality:
    needs: change-scope
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v2-production-') }}
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret
      FIELD_ENCRYPTION_KEY: ci-field-encryption-key
      HASH_SECRET: ci-hash-secret

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Install Chromium for layout acceptance
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check admin UI guardrails
        run: npm run check:admin-ui

      - name: Check Chinese UI language
        run: npm run check:v2-ui-language

      - name: Check V2 color contrast tokens
        run: npm run check:v2-color-contrast

      - name: Check V2 table standard
        run: npm run check:v2-table-standard

      - name: Verify V2 table action layouts
        run: npm run acceptance:v2-table-layout

      - name: Verify V2 button color contrast
        run: npm run acceptance:v2-color-contrast

      - name: Verify single-account recharge confirmation flow
        run: npm run acceptance:v2-auto-recharge

      - name: Check V2 loading standard
        run: npm run check:v2-loading-standard

      - name: Check single-system isolation
        run: npm run check:v2-isolation

      - name: Check module architecture
        run: npm run check:v2-module-architecture

      - name: Check Decimal standard
        run: npm run check:v2-decimal-standard

      - name: Check timezone standard
        run: npm run check:v2-timezone-standard

      - name: Check Prisma runtime boundary
        run: npm run check:v2-prisma-runtime-boundary

      - name: Check cloud independence
        run: npm run check:cloud-independence

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate MySQL Prisma schema
        run: npm run prisma:mysql:validate

      - name: Verify data governance workflow on MySQL
        run: npm run acceptance:v2-data-governance

      - name: Verify financial integrity on disposable MySQL
        run: npm run acceptance:v2-financial-integrity

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Validate AWS MySQL Compose example
        run: npm run aws:mysql:config:example

      - name: Audit high severity vulnerabilities
        if: ${{ needs.change-scope.outputs.dependency_audit == 'true' }}
        timeout-minutes: 3
        env:
          NPM_AUDIT_INFRASTRUCTURE_POLICY: ${{ github.event_name == 'pull_request' && 'warn' || 'fail' }}
        run: npm run audit:high

      - name: Check Git readiness
        run: npm run git:readiness

  production-images:
    needs: change-scope
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      id-token: write
    steps:
      - name: Skip unchanged production image boundary
        if: ${{ needs.change-scope.outputs.production_images != 'true' }}
        run: echo 'Production image inputs are unchanged; immutable images will be built once at release tag.'

      - name: Checkout
        if: ${{ needs.change-scope.outputs.production_images == 'true' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: ${{ needs.change-scope.outputs.production_images == 'true' }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Set up Docker Buildx
        if: ${{ needs.change-scope.outputs.production_images == 'true' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Configure AWS credentials for release images
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v2-production-') }}
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v2-production-') }}
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Validate immutable production tag and prior quality result
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v2-production-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          main_run_id="$(gh run list --workflow quality.yml --commit "$GITHUB_SHA" --event push --status success --limit 50 --json databaseId,headBranch,headSha --jq ".[] | select(.headBranch == \"main\" and .headSha == \"${GITHUB_SHA}\") | .databaseId" | head -n 1)"
          if [[ -z "$main_run_id" ]]; then
            echo '正式标签对应的 main Quality Gate 尚未成功，拒绝构建生产制品' >&2
            exit 1
          fi

          previous_release_run_id="$(gh run list --workflow quality.yml --commit "$GITHUB_SHA" --event push --status success --limit 50 --json databaseId,headBranch,headSha --jq ".[] | select(.headBranch != \"${GITHUB_REF_NAME}\" and (.headBranch | startswith(\"v2-production-\")) and .headSha == \"${GITHUB_SHA}\") | .databaseId" | head -n 1)"
          if [[ -n "$previous_release_run_id" ]]; then
            echo "该 commit 已由成功运行 ${previous_release_run_id} 构建过生产制品，拒绝重复构建" >&2
            exit 1
          fi

      - name: Audit high severity vulnerabilities before release build
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v2-production-') }}
        timeout-minutes: 3
        run: npm run audit:high

      - name: Validate AWS MySQL Compose example
        if: ${{ needs.change-scope.outputs.production_images == 'true' }}
        run: docker compose --env-file .env.aws.production.example -f docker-compose.aws-mysql.yml config

      - name: Detect reusable immutable ECR images
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v2-production-') }}
        id: ecr-state
        env:
          ECR_REPOSITORY_PREFIX: ${{ vars.AWS_ECR_REPOSITORY_PREFIX }}
        run: |
          set -Eeuo pipefail
          existing=0
          for image in api admin migration media-resolver recharge gate; do
            if aws ecr describe-images --repository-name "${ECR_REPOSITORY_PREFIX}-${image}" \
              --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
              existing=$((existing + 1))
            fi
          done
          if [[ "$existing" == 0 ]]; then
            echo 'reuse=false' >>"$GITHUB_OUTPUT"
          elif [[ "$existing" == 6 ]]; then
            echo 'reuse=true' >>"$GITHUB_OUTPUT"
          else
            echo '发现不完整的 ECR 发布镜像集，拒绝混用制品' >&2
            exit 1
          fi

      - name: Build AWS MySQL production images with Buildx cache
        if: ${{ needs.change-scope.outputs.production_images == 'true' && (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v2-production-') || steps.ecr-state.outputs.reuse != 'true') }}
        run: |
          set -Eeuo pipefail
          build_image() {
            local scope="$1" dockerfile="$2" target="$3"
            shift 3
            target_args=()
            [[ "$target" == - ]] || target_args=(--target "$target")
            cache_to=()
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then
              cache_to=(--cache-to "type=gha,scope=${scope},mode=max")
            fi
            docker buildx build --load --platform linux/amd64 --provenance=false --sbom=false \
              --cache-from "type=gha,scope=${scope}" "${cache_to[@]}" \
              --file "$dockerfile" "${target_args[@]}" "$@" .
          }
          build_image api-runtime apps/api/Dockerfile.mysql runtime --tag id-business-v2-prod-api:latest --tag "id-business-v2-release-api:${GITHUB_SHA}"
          build_image api-migration apps/api/Dockerfile.mysql migration --tag id-business-v2-prod-migrate:latest --tag "id-business-v2-release-migration:${GITHUB_SHA}"
          build_image admin apps/admin/Dockerfile - --build-arg AUTH_PROVIDER=local --build-arg VITE_API_BASE_URL=/api --build-arg 'VITE_APP_TITLE=ID 业务管理系统' --tag id-business-v2-prod-admin:latest --tag "id-business-v2-release-admin:${GITHUB_SHA}"
          build_image media-resolver apps/api/src/id-business-v2/workspace/media-resolver/Dockerfile - --tag id-business-v2-prod-media-resolver:latest --tag "id-business-v2-release-media-resolver:${GITHUB_SHA}"
          build_image auto-recharge apps/api/src/id-business-v2/auto-recharge/worker/Dockerfile - --tag id-business-v2-prod-auto-recharge:latest --tag "id-business-v2-release-recharge:${GITHUB_SHA}"
          build_image release-gate apps/api/Dockerfile.mysql build --tag "id-business-v2-release-gate:${GITHUB_SHA}"

      - name: Pull reusable immutable ECR images
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v2-production-') && steps.ecr-state.outputs.reuse == 'true' }}
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY_PREFIX: ${{ vars.AWS_ECR_REPOSITORY_PREFIX }}
        run: |
          set -Eeuo pipefail
          for image in api admin migration media-resolver recharge gate; do
            docker pull --platform linux/amd64 "${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}-${image}:${GITHUB_SHA}"
            docker tag "${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}-${image}:${GITHUB_SHA}" "id-business-v2-release-${image}:${GITHUB_SHA}"
          done
          docker tag "id-business-v2-release-api:${GITHUB_SHA}" id-business-v2-prod-api:latest
          docker tag "id-business-v2-release-admin:${GITHUB_SHA}" id-business-v2-prod-admin:latest
          docker tag "id-business-v2-release-migration:${GITHUB_SHA}" id-business-v2-prod-migrate:latest
          docker tag "id-business-v2-release-media-resolver:${GITHUB_SHA}" id-business-v2-prod-media-resolver:latest
          docker tag "id-business-v2-release-recharge:${GITHUB_SHA}" id-business-v2-prod-auto-recharge:latest

      - name: Test auto-recharge production image
        if: ${{ needs.change-scope.outputs.production_images == 'true' }}
        run: docker run --rm --init --entrypoint xvfb-run id-business-v2-prod-auto-recharge:latest -a python -B -m unittest -q test_subscribe.py test_browser.py test_payment.py test_pro.py test_server.py

      - name: Verify built production image boundaries
        if: ${{ needs.change-scope.outputs.production_images == 'true' }}
        env:
          V2_RUNTIME_IMAGE: id-business-v2-prod-api:latest
          V2_MIGRATION_IMAGE: id-business-v2-prod-migrate:latest
          V2_MEDIA_RESOLVER_IMAGE: id-business-v2-prod-media-resolver:latest
        run: node scripts/acceptance-v2-container-hardening.mjs

      - name: Publish immutable production images to ECR
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v2-production-') }}
        id: release-images
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY_PREFIX: ${{ vars.AWS_ECR_REPOSITORY_PREFIX }}
          REUSE_IMAGES: ${{ steps.ecr-state.outputs.reuse }}
        run: |
          set -Eeuo pipefail
          for image in api admin migration media-resolver recharge gate; do
            local_reference="id-business-v2-release-${image}:${GITHUB_SHA}"
            ecr_reference="${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}-${image}:${GITHUB_SHA}"
            if [[ "$REUSE_IMAGES" != true ]]; then
              docker tag "$local_reference" "$ecr_reference"
              docker push "$ecr_reference"
            fi
            digest="$(aws ecr describe-images --repository-name "${ECR_REPOSITORY_PREFIX}-${image}" \
              --image-ids "imageTag=${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text)"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            output_name="${image//-/_}"
            echo "${output_name}_reference=${ecr_reference}" >>"$GITHUB_OUTPUT"
            echo "${output_name}_digest=${digest}" >>"$GITHUB_OUTPUT"
          done

      - name: Package immutable production artifact
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v2-production-') }}
        id: package-release
        env:
          RELEASE_SOURCE_BRANCH: main
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_CI_RUN_ID: ${{ github.run_id }}
          RELEASE_CI_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_OPERATOR: github-actions
          RELEASE_OUTPUT_DIR: release-artifacts
          RELEASE_AWS_REGION: ${{ vars.AWS_REGION }}
          RELEASE_ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          RELEASE_API_IMAGE: ${{ steps.release-images.outputs.api_reference }}
          RELEASE_API_DIGEST: ${{ steps.release-images.outputs.api_digest }}
          RELEASE_ADMIN_IMAGE: ${{ steps.release-images.outputs.admin_reference }}
          RELEASE_ADMIN_DIGEST: ${{ steps.release-images.outputs.admin_digest }}
          RELEASE_MIGRATION_IMAGE: ${{ steps.release-images.outputs.migration_reference }}
          RELEASE_MIGRATION_DIGEST: ${{ steps.release-images.outputs.migration_digest }}
          RELEASE_MEDIA_RESOLVER_IMAGE: ${{ steps.release-images.outputs.media_resolver_reference }}
          RELEASE_MEDIA_RESOLVER_DIGEST: ${{ steps.release-images.outputs.media_resolver_digest }}
          RELEASE_RECHARGE_IMAGE: ${{ steps.release-images.outputs.recharge_reference }}
          RELEASE_RECHARGE_DIGEST: ${{ steps.release-images.outputs.recharge_digest }}
          RELEASE_GATE_IMAGE: ${{ steps.release-images.outputs.gate_reference }}
          RELEASE_GATE_DIGEST: ${{ steps.release-images.outputs.gate_digest }}
        run: bash scripts/package-production-release.sh

      - name: Verify immutable production artifact
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v2-production-') }}
        run: >-
          node scripts/verify-production-release-artifact.mjs
          --directory release-artifacts
          --expected-commit "$GITHUB_SHA"
          --expected-tag "$GITHUB_REF_NAME"

      - name: Upload immutable production artifact
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v2-production-') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package-release.outputs.github_artifact_name }}
          path: |
            ${{ steps.package-release.outputs.artifact_path }}
            ${{ steps.package-release.outputs.manifest_path }}
            ${{ steps.package-release.outputs.checksum_path }}
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
