name: Independent Source Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up the verified Node.js version
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.22.1'
      - name: Prepare the pinned recharge source
        shell: bash
        run: |
          set -euo pipefail
          revision=$(node --input-type=module -e 'import { CODEXDAICHONG_REVISION } from "./modules/recharge/codexdaichong/prepare.mjs"; console.log(CODEXDAICHONG_REVISION)')
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          install -d -m 0700 .runtime backups .upstream/codexdaichong
          git -C .upstream/codexdaichong init --quiet
          git -C .upstream/codexdaichong fetch --quiet --depth=1 --no-tags https://github.com/wangchaozhuanyong/codexdaichong.git "$revision"
          test "$(git -C .upstream/codexdaichong rev-parse FETCH_HEAD)" = "$revision"
          git -C .upstream/codexdaichong checkout --quiet --detach "$revision"
      - name: Run the isolated test suite
        run: npm test
