name: Quality Gate

on:
  push:
    branches:
      - main
      - 'codex/**-release-*'
    tags:
      - 'v2-production-*'
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret
      FIELD_ENCRYPTION_KEY: ci-field-encryption-key
      HASH_SECRET: ci-hash-secret

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for layout acceptance
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check admin UI guardrails
        run: npm run check:admin-ui

      - name: Check Chinese UI language
        run: npm run check:v2-ui-language

      - name: Check V2 color contrast tokens
        run: npm run check:v2-color-contrast

      - name: Check V2 table standard
        run: npm run check:v2-table-standard

      - name: Verify V2 table action layouts
        run: npm run acceptance:v2-table-layout

      - name: Verify V2 button color contrast
        run: npm run acceptance:v2-color-contrast

      - name: Check V2 loading standard
        run: npm run check:v2-loading-standard

      - name: Check single-system isolation
        run: npm run check:v2-isolation

      - name: Check module architecture
        run: npm run check:v2-module-architecture

      - name: Check Decimal standard
        run: npm run check:v2-decimal-standard

      - name: Check timezone standard
        run: npm run check:v2-timezone-standard

      - name: Check Prisma runtime boundary
        run: npm run check:v2-prisma-runtime-boundary

      - name: Check cloud independence
        run: npm run check:cloud-independence

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate MySQL Prisma schema
        run: npm run prisma:mysql:validate

      - name: Verify data governance workflow on MySQL
        run: npm run acceptance:v2-data-governance

      - name: Verify financial integrity on disposable MySQL
        run: npm run acceptance:v2-financial-integrity

      - name: Build shared package
        run: npm run build --workspace @apple-business/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Validate AWS MySQL Compose example
        run: npm run aws:mysql:config:example

      - name: Audit high severity vulnerabilities
        timeout-minutes: 20
        run: npm run audit:high

      - name: Check Git readiness
        run: npm run git:readiness

  production-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Validate immutable production tag
        if: startsWith(github.ref, 'refs/tags/v2-production-')
        run: |
          git fetch origin main --no-tags
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Validate AWS MySQL Compose example
        run: docker compose --env-file .env.aws.production.example -f docker-compose.aws-mysql.yml config

      - name: Build AWS MySQL production images
        env:
          COMPOSE_BAKE: 'false'
          DOCKER_BUILDKIT: '0'
        run: |
          docker compose --env-file .env.aws.production.example -f docker-compose.aws-mysql.yml build migrate media-resolver api admin
          docker tag id-business-v2-prod-api:latest "id-business-v2-release-api:${GITHUB_SHA}"
          docker tag id-business-v2-prod-admin:latest "id-business-v2-release-admin:${GITHUB_SHA}"
          docker tag id-business-v2-prod-migrate:latest "id-business-v2-release-migration:${GITHUB_SHA}"
          docker tag id-business-v2-prod-media-resolver:latest "id-business-v2-release-media-resolver:${GITHUB_SHA}"
          docker build --target build --tag "id-business-v2-release-gate:${GITHUB_SHA}" --file apps/api/Dockerfile.mysql .

      - name: Verify built production image boundaries
        env:
          V2_RUNTIME_IMAGE: id-business-v2-prod-api:latest
          V2_MIGRATION_IMAGE: id-business-v2-prod-migrate:latest
          V2_MEDIA_RESOLVER_IMAGE: id-business-v2-prod-media-resolver:latest
        run: node scripts/acceptance-v2-container-hardening.mjs

      - name: Package immutable production artifact
        if: startsWith(github.ref, 'refs/tags/v2-production-')
        id: package-release
        env:
          RELEASE_SOURCE_BRANCH: main
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_CI_RUN_ID: ${{ github.run_id }}
          RELEASE_CI_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_OPERATOR: github-actions
          RELEASE_OUTPUT_DIR: release-artifacts
          RELEASE_API_IMAGE: id-business-v2-release-api:${{ github.sha }}
          RELEASE_ADMIN_IMAGE: id-business-v2-release-admin:${{ github.sha }}
          RELEASE_MIGRATION_IMAGE: id-business-v2-release-migration:${{ github.sha }}
          RELEASE_MEDIA_RESOLVER_IMAGE: id-business-v2-release-media-resolver:${{ github.sha }}
          RELEASE_GATE_IMAGE: id-business-v2-release-gate:${{ github.sha }}
        run: bash scripts/package-production-release.sh

      - name: Verify immutable production artifact
        if: startsWith(github.ref, 'refs/tags/v2-production-')
        run: >-
          node scripts/verify-production-release-artifact.mjs
          --directory release-artifacts
          --expected-commit "$GITHUB_SHA"
          --expected-tag "$GITHUB_REF_NAME"

      - name: Upload immutable production artifact
        if: startsWith(github.ref, 'refs/tags/v2-production-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package-release.outputs.github_artifact_name }}
          path: |
            ${{ steps.package-release.outputs.artifact_path }}
            ${{ steps.package-release.outputs.manifest_path }}
            ${{ steps.package-release.outputs.checksum_path }}
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
