name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    runs-on: ubuntu-latest
    outputs:
      dependency_audit: ${{ steps.scope.outputs.dependency_audit }}
      mode: ${{ steps.recharge.outputs.mode }}
      reuse_main: ${{ steps.recharge.outputs.reuse_main }}
      reused_parts: ${{ steps.recharge.outputs.reused_parts }}
      base: ${{ steps.recharge.outputs.base }}
      check_parts: ${{ steps.recharge.outputs.check_parts }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            printf '' | node scripts/ci-change-scope.mjs
            exit 0
          fi

          base_sha="$BASE_SHA"
          if [[ ! "$base_sha" =~ ^[a-f0-9]{40}$ || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)"
          fi
          if [[ "$base_sha" =~ ^[a-f0-9]{40}$ ]]; then
            git diff --name-only "$base_sha" "$GITHUB_SHA" | node scripts/ci-change-scope.mjs
          else
            git show --format= --name-only "$GITHUB_SHA" | node scripts/ci-change-scope.mjs
          fi

      - name: Scope recharge checks and verify prior evidence
        id: recharge
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ || "$BASE_SHA" =~ ^0+$ ]]; then
            export BASE_SHA="$(git rev-parse HEAD^)"
          fi
          node scripts/ci-recharge-scope.mjs

  full-quality:
    if: needs.change-scope.outputs.mode == 'full' && needs.change-scope.outputs.reuse_main != 'true'
    needs: change-scope
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret
      FIELD_ENCRYPTION_KEY: ci-field-encryption-key
      HASH_SECRET: ci-hash-secret

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Install Chromium for layout acceptance
        run: npx playwright install chromium

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check admin UI guardrails
        run: npm run check:admin-ui

      - name: Check Chinese UI language
        run: npm run check:v2-ui-language

      - name: Check V2 color contrast tokens
        run: npm run check:v2-color-contrast

      - name: Check V2 table standard
        run: npm run check:v2-table-standard

      - name: Verify V2 table action layouts
        run: npm run acceptance:v2-table-layout

      - name: Verify V2 button color contrast
        run: npm run acceptance:v2-color-contrast

      - name: Verify single-account recharge confirmation flow
        run: npm run acceptance:v2-auto-recharge

      - name: Check V2 loading standard
        run: npm run check:v2-loading-standard

      - name: Check single-system isolation
        run: npm run check:v2-isolation

      - name: Check module architecture
        run: npm run check:v2-module-architecture

      - name: Check Decimal standard
        run: npm run check:v2-decimal-standard

      - name: Check timezone standard
        run: npm run check:v2-timezone-standard

      - name: Check Prisma runtime boundary
        run: npm run check:v2-prisma-runtime-boundary

      - name: Check cloud independence
        run: npm run check:cloud-independence

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate MySQL Prisma schema
        run: npm run prisma:mysql:validate

      - name: Verify data governance workflow on MySQL
        run: npm run acceptance:v2-data-governance

      - name: Verify financial integrity on disposable MySQL
        run: npm run acceptance:v2-financial-integrity

      - name: Verify rollback, deletion and restore integrity on MySQL
        run: npm run acceptance:v2-rollback-integrity

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Audit high severity vulnerabilities
        if: ${{ needs.change-scope.outputs.dependency_audit == 'true' }}
        timeout-minutes: 3
        env:
          NPM_AUDIT_INFRASTRUCTURE_POLICY: ${{ github.event_name == 'pull_request' && 'warn' || 'fail' }}
        run: npm run audit:high

      - name: Check Git readiness
        run: npm run git:readiness

  recharge:
    if: needs.change-scope.outputs.mode != 'full' && needs.change-scope.outputs.reuse_main != 'true'
    needs: change-scope
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.change-scope.outputs.check_parts) }}
    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret
      FIELD_ENCRYPTION_KEY: ci-field-encryption-key
      HASH_SECRET: ci-hash-secret
    steps:
      - name: Report reused passing check
        if: contains(fromJSON(needs.change-scope.outputs.reused_parts), matrix.part)
        run: echo "Source inputs unchanged; prior passing check is linked in the scope summary."
      - name: Checkout
        if: ${{ !contains(fromJSON(needs.change-scope.outputs.reused_parts), matrix.part) }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        if: ${{ !contains(fromJSON(needs.change-scope.outputs.reused_parts), matrix.part) }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Install package dependencies
        if: ${{ !contains(fromJSON(needs.change-scope.outputs.reused_parts), matrix.part) && contains(fromJSON('["guards","admin","api"]'), matrix.part) }}
        run: npm ci --no-audit
      - name: Install browser for recharge acceptance
        if: ${{ !contains(fromJSON(needs.change-scope.outputs.reused_parts), matrix.part) && matrix.part == 'admin' }}
        run: npx playwright install chromium
      - name: Install existing connector dependencies
        if: ${{ !contains(fromJSON(needs.change-scope.outputs.reused_parts), matrix.part) && matrix.part == 'connector' }}
        run: python3 -m pip install --disable-pip-version-check -r apps/api/src/id-business-v2/auto-recharge/worker/requirements.lock.txt
      - name: Check affected recharge part
        if: ${{ !contains(fromJSON(needs.change-scope.outputs.reused_parts), matrix.part) }}
        env:
          CHECK_PART: ${{ matrix.part }}
          CHECK_BASE: ${{ needs.change-scope.outputs.base }}
        run: node scripts/ci-recharge-check.mjs "$CHECK_PART" "$CHECK_BASE"

  quality:
    if: always()
    needs: [change-scope, full-quality, recharge]
    runs-on: ubuntu-latest
    steps:
      - name: Require passing applicable checks or verified identical-tree evidence
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          REUSE_MAIN: ${{ needs.change-scope.outputs.reuse_main }}
          MODE: ${{ needs.change-scope.outputs.mode }}
          FULL_RESULT: ${{ needs.full-quality.result }}
          RECHARGE_RESULT: ${{ needs.recharge.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [[ "$REUSE_MAIN" = true ]]; then
            echo "Merged source tree matches the successful PR; checks are not repeated."
          elif [[ "$MODE" = recharge || "$MODE" = ci-only ]]; then
            test "$RECHARGE_RESULT" = success
          else
            test "$FULL_RESULT" = success
          fi
      - name: Checkout the tested source tree for its evidence
        if: github.event_name == 'pull_request'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Record successful PR source evidence
        if: github.event_name == 'pull_request'
        run: node scripts/ci-recharge-evidence.mjs
      - name: Preserve successful source evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-source-evidence-${{ github.run_attempt }}
          path: .deploy/ci-evidence/evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
