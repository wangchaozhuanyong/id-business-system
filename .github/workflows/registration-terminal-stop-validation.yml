name: Registration Terminal Stop

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed main commit
        required: true
        type: string
      expected_current:
        description: Exact independently verified deployed predecessor
        required: true
        type: string
      publish:
        description: Publish once after isolated Worker validation
        default: false
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: id-business-v2-production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Verify finite API-only admission and preservation controls
        run: python3 -B scripts/production-release/registration-terminal-stop-release.test.py
      - name: Verify the native published predecessor and prepare the Worker candidate
        run: python3 -B scripts/production-release/registration-terminal-stop-build.py prepare
      - name: Verify terminal propagation and isolated encrypted persistence
        run: python3 -B scripts/production-release/registration-terminal-stop-build.py check-worker
      - name: Package only the approved Worker file
        run: python3 -B scripts/production-release/registration-terminal-stop-build.py package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: registration-terminal-stop-20261017-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .deploy/registration-terminal-stop-20261017/registration-terminal-stop-20261017-artifact.tar.gz
            .deploy/registration-terminal-stop-20261017/artifact-sha256.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: validate
    if: inputs.publish && github.ref == 'refs/heads/main' && inputs.commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_REGION: ap-northeast-1
      RELEASE_COMMIT: ${{ inputs.commit }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
      REGISTRATION_TERMINAL_STOP_20261017: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::079740175286:role/id-business-v2-github-release
          role-session-name: id-business-v2-registration-terminal-stop-${{ github.run_id }}
          aws-region: ap-northeast-1
          role-duration-seconds: 3600
      - name: Publish once and independently read back
        run: python3 -B scripts/production-release/registration-terminal-stop-dispatch.py
      - name: Preserve native publication receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: registration-terminal-stop-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/registration-terminal-stop-20261017/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
