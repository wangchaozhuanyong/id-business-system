name: Recharge Availability Repair Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed main commit
        required: true
        type: string
      expected_current:
        description: Exact deployed predecessor commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: id-business-v2-production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: availability-ci-fixture
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: id_business_v2_employee_connections_flow_${{ github.run_id }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pavailability-ci-fixture"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:availability-ci-fixture@127.0.0.1:3306/id_business_v2_employee_connections_flow_${{ github.run_id }}
      JWT_SECRET: ci-availability-jwt
      FIELD_ENCRYPTION_KEY: ci-availability-field-key
      HASH_SECRET: ci-availability-hash-key
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Verify bounded publication controls
        run: python3 -B scripts/production-release/recharge-availability-release.test.py
      - name: Prepare exact published sources and approved delta
        run: python3 -B scripts/production-release/recharge-availability-build.py prepare
      - name: Migrate only the disposable runner database
        working-directory: .deploy/recharge-availability-release/candidate
        run: npm run prisma:mysql:migrate:deploy
      - name: Verify availability queries, locking, idempotency and audit rollback in isolated MySQL
        working-directory: .deploy/recharge-availability-release/candidate
        env:
          V2_RECHARGE_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          npm run test --workspace @apple-business/api -- src/id-business-v2/auto-recharge/recharge-availability.mysql.integration.spec.ts
          npm run test --workspace @apple-business/api -- src/id-business-v2/auto-recharge/recharge-callback-receipts.mysql.integration.spec.ts src/id-business-v2/auto-recharge/recharge-employee-concurrency.mysql.integration.spec.ts src/id-business-v2/auto-recharge/recharge-subscription-cycle.mysql.integration.spec.ts
      - name: Verify published provenance and build finite API and Admin artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/production-release/recharge-availability-build.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recharge-availability-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .deploy/recharge-availability-release/recharge-availability-artifact.tar.gz
            .deploy/recharge-availability-release/artifact-sha256.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_REGION: ap-northeast-1
      RELEASE_COMMIT: ${{ inputs.commit }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Configure existing production OIDC role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::079740175286:role/id-business-v2-github-release
          role-session-name: id-business-v2-availability-${{ github.run_id }}
          aws-region: ap-northeast-1
          role-duration-seconds: 3600
      - name: Publish once and independently read back
        run: python3 -B scripts/production-release/recharge-availability-dispatch.py
      - name: Preserve native publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recharge-availability-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/recharge-availability-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
