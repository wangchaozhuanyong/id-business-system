name: Independent Production Read-only Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'wangchaozhuanyong/id-business-system' && github.ref == 'refs/heads/main'
    environment: production-readonly-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test the audit rules
        run: python3 -B -m unittest discover -s deploy/audit -p '*_test.py'
      - name: Assume the scoped audit role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: arn:aws:iam::098208446664:role/id-business-v2-github-audit
          aws-region: ap-northeast-1
          allowed-account-ids: '098208446664'
          mask-aws-account-id: true
          role-session-name: id-audit-${{ github.run_id }}
          role-duration-seconds: 900
      - name: Verify project controls
        run: python3 -B deploy/audit/run.py
