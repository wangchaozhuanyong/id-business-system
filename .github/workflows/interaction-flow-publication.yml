name: Interaction Flow Publication
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish Admin or inspect the parent without publication
        required: true
        default: publish
        type: choice
        options:
          - publish
          - observe
      commit:
        description: Exact reviewed main commit
        required: true
        type: string
      expected_current:
        description: Exact deployed predecessor
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: id-business-v2-production-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Verify finite Admin-only source controls
        run: |
          python3 -B scripts/production-release/interaction-flow-publication.py check
          python3 -B scripts/production-release/interaction-flow-runtime.test.py
      - name: Configure existing production observation role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::098208446664:role/id-business-v2-github-release
          role-session-name: id-business-v2-interaction-flow-observe-${{ github.run_id }}
          aws-region: ap-northeast-1
      - name: Inspect parent without publication
        if: inputs.operation == 'observe'
        run: python3 -B scripts/production-release/interaction-flow-publication.py observe
      - name: Reproduce current Admin and build the reviewed main revision
        if: inputs.operation == 'publish'
        run: python3 -B scripts/production-release/interaction-flow-publication.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.operation == 'publish'
        with:
          name: interaction-flow-native-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .deploy/interaction-flow/interaction-flow-artifact.tar.gz
            .deploy/interaction-flow/artifact-sha256.txt
          include-hidden-files: true
          if-no-files-found: error
      - name: Preserve original observation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interaction-flow-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/interaction-flow/*.json
          include-hidden-files: true
          if-no-files-found: warn
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha && inputs.operation == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::098208446664:role/id-business-v2-github-release
          role-session-name: id-business-v2-interaction-flow-publish-${{ github.run_id }}
          aws-region: ap-northeast-1
      - name: Publish only Admin and independently read back
        run: python3 -B scripts/production-release/interaction-flow-publication.py publish
      - name: Preserve original release receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interaction-flow-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/interaction-flow/*.*
          include-hidden-files: true
          if-no-files-found: warn
