name: Online Embedded Checkout Validation

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed main commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: id-business-v2-production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      FIELD_ENCRYPTION_KEY: synthetic-checkout-cs-fixture-key
      HASH_SECRET: synthetic-checkout-cs-fixture-index
      ONLINE_RECHARGE_WORKER_KEY: synthetic-checkout-cs-fixture-worker-key-32-characters
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Verify finite publication and preservation controls
        run: python3 -B scripts/production-release/online-checkout-cs-release.test.py
      - name: Authenticate unchanged API and engine validation
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/production-release/online-checkout-cs-build.py --verify-reuse >> "$GITHUB_OUTPUT"
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm run prisma:mysql:generate && npm run build --workspace @apple-business/shared
      - name: Verify source-bound original checkout and submission protection
        if: steps.prior.outputs.reused != 'true'
        run: |
          npm run typecheck --workspace @apple-business/api
          npm run test --workspace @apple-business/api -- src/id-business-v2/online-recharge
          npm run check:v2-module-architecture
          npm run check:v2-isolation
          npm run check:v2-prisma-runtime-boundary
          npm run check:v2-concurrency-standard
          npm run check:v2-decimal-standard
      - name: Verify intercepted Chromium checkout and engine regressions
        if: steps.prior.outputs.reused != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb xauth
          npm ci --prefix apps/api/src/id-business-v2/online-recharge/engine/upstream --ignore-scripts --no-audit --no-fund
          npx --prefix apps/api/src/id-business-v2/online-recharge/engine/upstream playwright install --with-deps chromium
          npm run test:online-recharge:engine
      - name: Reproduce published API and build only the reviewed API and engine delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/production-release/online-checkout-cs-build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: online-checkout-cs-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .deploy/online-checkout-cs/online-checkout-cs-artifact.tar.gz
            .deploy/online-checkout-cs/artifact-sha256.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
