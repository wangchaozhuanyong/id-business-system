name: Recharge Plan Billing Publication

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed main commit
        required: true
        type: string
      expected_current:
        description: Exact deployed predecessor commit
        required: true
        type: string

permissions:
  contents: write
  actions: read
  pull-requests: read
  id-token: write

concurrency:
  group: id-business-v2-production-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_REGION: ap-northeast-1
      RELEASE_COMMIT: ${{ inputs.commit }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Verify main and bounded publication controls
        run: |
          bash scripts/production-release/check-source.sh
          python3 -B scripts/production-release/recharge-plan-billing-release.test.py
      - name: Configure existing production OIDC role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::098208446664:role/id-business-v2-github-release
          role-session-name: id-billing-${{ github.run_id }}
          aws-region: ap-northeast-1
          role-duration-seconds: 3600
      - name: Build the migration tool from this exact main commit
        run: |
          set -Eeuo pipefail
          python3 -B scripts/production-release/recharge-plan-billing-publication.py check
          registry=098208446664.dkr.ecr.ap-northeast-1.amazonaws.com
          image="$registry/id-business-v2-release:$GITHUB_SHA-$GITHUB_RUN_ID-billing-migrate"
          aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin "$registry"
          docker build --target migration --file apps/api/Dockerfile.mysql --tag "$image" .
          docker push "$image"
          digest="$(aws ecr describe-images --repository-name id-business-v2-release --image-ids imageTag="$GITHUB_SHA-$GITHUB_RUN_ID-billing-migrate" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "MIGRATION_IMAGE=$registry/id-business-v2-release@$digest" >> "$GITHUB_ENV"
          mkdir -p .runtime/recharge-plan-billing-migration
          docker save "$image" | gzip -1 > .runtime/recharge-plan-billing-migration/image.tar.gz
          echo "MIGRATION_ARCHIVE=$GITHUB_WORKSPACE/.runtime/recharge-plan-billing-migration/image.tar.gz" >> "$GITHUB_ENV"
          echo "MIGRATION_LOCAL_REFERENCE=$image" >> "$GITHUB_ENV"
          echo "MIGRATION_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$image")" >> "$GITHUB_ENV"
      - name: Reproduce the published source and rebuild the reviewed main delta
        run: python3 -B scripts/production-release/recharge-plan-billing-publication.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recharge-plan-billing-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .deploy/recharge-plan-billing/recharge-plan-billing-artifact.tar.gz
            .deploy/recharge-plan-billing/artifact-sha256.txt
            .deploy/recharge-plan-billing/recharge-plan-billing-migration.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Publish once, migrate only the reviewed SQL and independently read back
        run: python3 -B scripts/production-release/recharge-plan-billing-publication.py publish
      - name: Preserve native publication receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recharge-plan-billing-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/recharge-plan-billing/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
