name: GPT Recharge Integration Validation

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed main commit to package
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Verify publication preservation boundaries
        run: python3 -B scripts/production-release/gpt-recharge-release.test.py
      - name: Reproduce deployed API and verify only the recharge integration delta
        run: python3 -B scripts/production-release/gpt-recharge-build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpt-recharge-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .deploy/gpt-recharge-build/gpt-recharge-artifact.tar.gz
            .deploy/gpt-recharge-build/artifact-sha256.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
