name: Registration Protocol Restore Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed main commit
        required: true
        type: string
      expected_current:
        description: Exact independently verified deployed predecessor
        required: true
        type: string
      publish:
        description: Publish after isolated validation
        default: false
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: id-business-v2-production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REGISTRATION_PROTOCOL_RESTORE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Verify finite publication and preservation controls
        run: python3 -B scripts/production-release/registration-protocol-restore-release.test.py
      - name: Reconstruct exact deployed sources and the reviewed delta
        run: python3 -B scripts/production-release/registration-protocol-restore-build.py prepare
      - name: Prepare unchanged isolated Python and browser dependencies
        run: |
          python3 -m venv .deploy/registration-protocol-restore/python
          .deploy/registration-protocol-restore/python/bin/pip install --disable-pip-version-check -r .deploy/registration-protocol-restore/candidate/apps/api/src/id-business-v2/auto-registration/worker/requirements.lock.txt
          .deploy/registration-protocol-restore/python/bin/pip check
          cd .deploy/registration-protocol-restore/candidate
          npx playwright install --with-deps chromium
      - name: Reproduce published API Admin schema and generated client
        run: python3 -B scripts/production-release/registration-protocol-restore-build.py build
      - name: Verify protocol restoration historical records and both interfaces
        run: python3 -B scripts/production-release/registration-protocol-restore-build.py validate
      - name: Package only the verified no-migration delta
        run: python3 -B scripts/production-release/registration-protocol-restore-build.py package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: registration-protocol-restore-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .deploy/registration-protocol-restore/registration-protocol-restore-artifact.tar.gz
            .deploy/registration-protocol-restore/artifact-sha256.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: validate
    if: inputs.publish && github.ref == 'refs/heads/main' && inputs.commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_REGION: ap-northeast-1
      RELEASE_COMMIT: ${{ inputs.commit }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
      REGISTRATION_PROTOCOL_RESTORE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Configure existing production OIDC role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::079740175286:role/id-business-v2-github-release
          role-session-name: id-business-v2-registration-protocol-restore-${{ github.run_id }}
          aws-region: ap-northeast-1
          role-duration-seconds: 3600
      - name: Publish once and independently read back
        run: python3 -B scripts/production-release/registration-protocol-restore-dispatch.py
      - name: Preserve native publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: registration-protocol-restore-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/registration-protocol-restore/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
