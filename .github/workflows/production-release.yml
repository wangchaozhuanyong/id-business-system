          operation = os.environ['CACHE_OPERATION']
          expected = os.environ['RELEASE_COMMIT'] if operation == 'release' else os.environ['EXPECTED_CURRENT']
          command = 'python3 -c ' + shlex.quote(Path('scripts/production-release/maintain-image-cache.py').read_text())
          command += ' --expected-current ' + shlex.quote(expected)
          if operation in ('verify_unused_builder_cache', 'cleanup_unused_builder_cache'):
              command += ' --legacy-builder-cache'
              if operation == 'cleanup_unused_builder_cache':
                  digest = os.environ['CACHE_PLAN_SHA256']
                  if not re.fullmatch(r'[0-9a-f]{64}', digest):
                      raise SystemExit('Exact verified builder cache plan digest required')
                  command += ' --apply --approved-policy unused-builder-cache-20261003 --approved-plan-sha256 ' + digest
          elif operation in ('verify_unused_legacy_cache', 'cleanup_unused_legacy_cache'):
              command += ' --legacy-plan-json ' + shlex.quote(Path('deploy/aws/cache-cleanup-unused-legacy-20261003.json').read_text())
              if operation == 'cleanup_unused_legacy_cache':
                  digest = os.environ['CACHE_PLAN_SHA256']
                  if not re.fullmatch(r'[0-9a-f]{64}', digest):
                      raise SystemExit('Exact verified obsolete cache plan digest required')
                  command += ' --apply --approved-policy reviewed-obsolete-project-cache-20261003 --approved-plan-sha256 ' + digest
          elif operation == 'cleanup_unused_cache':
