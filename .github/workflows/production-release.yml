name: Production Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify access or mailbox, clean reviewed cache, or publish the exact commit
        required: true
        default: verify_access
        type: choice
        options:
          - verify_access
          - verify_online_recharge
          - release_online_recharge
          - verify_api_admin
          - verify_api_workspace
          - release_api_workspace
          - release_api_admin
          - verify_api_admin_migration
          - release_api_admin_migration
          - verify_recharge_release
          - verify_mailbox
          - verify_cache
          - cleanup_cache
          - verify_unused_cache
          - cleanup_unused_cache
          - verify_unused_legacy_cache
          - cleanup_unused_legacy_cache
          - verify_unused_builder_cache
          - cleanup_unused_builder_cache
          - verify_backups
          - cleanup_backups
          - diagnose_storage
          - verify_release_archive_cache
          - archive_release_cache
          - cleanup_audit
          - verify_legacy_cache
          - cleanup_legacy_cache
          - release
          - prepare_post_cleanup_release
          - prepare_order_archive_release
      commit:
        description: Exact main commit to publish (40 lowercase hex characters)
        required: true
        type: string
      expected_current:
        description: Exact commit currently running in production
        required: true
        type: string
      cleanup_plan:
        description: Exact reviewed local image cache plan (cleanup operations only)
        required: true
        default: initial_20261001
        type: choice
        options:
          - initial_20261001
          - fx_subscription_20261002
          - unified_20261002
          - unified_recovery_20261002
          - recharge_names_20261002
          - recharge_execution_20261002
          - storage_20261002
          - bitbrowser_direct_20261003
      reuse_image_run:
        description: Optional completed build run to reuse after a release-control-only repair
        required: false
        default: ''
        type: string

      historical_exception:
        description: One user-approved historical finance exception; preserves original data
        required: true
        default: none
        type: choice
        options:
          - none
          - historical-finance-20261005
          - historical-finance-20261005-recharge-diagnostics
          - historical-finance-20261005-maintenance-continuation
          - historical-finance-20261005-mailbox-batch
          - recharge-pro-menu-b8-20261005
          - recharge-pro-menu-7f-20261005
          - recharge-pro-main80-20261006
          - recharge-pro-974-20261007
          - recharge-pro-2f-20261007
          - recharge-pro-4c-20261008
          - recharge-pro-6f5-20261008
          - recharge-pro-pricing-045-20261008

          - historical-finance-20261005-post-cleanup
          - historical-finance-20261005-order-archive

      post_cleanup_seal_sha256:
        description: Exact reviewed post-cleanup source proof seal SHA256 (release only)
        required: false
        default: ''
        type: string

      order_archive_seal_sha256:
        description: Exact independently reviewed order archive release seal SHA256 (release only)
        required: false
        default: ''
        type: string

      diagnostic_command_id:
        description: Optional exact failed SSM command to inspect in verify_access (UUID)
        required: false
        default: ''
        type: string

      cache_plan_sha256:
        description: Exact verified image or release archive cache plan digest (cleanup operations only)
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: id-business-v2-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_REGION: ap-northeast-1
      RELEASE_ROLE_ARN: arn:aws:iam::079740175286:role/id-business-v2-github-release
      RELEASE_REPOSITORY: 079740175286.dkr.ecr.ap-northeast-1.amazonaws.com/id-business-v2-release
      PRODUCTION_INSTANCE_ID: i-05836da38606e633c
      RELEASE_COMMIT: ${{ inputs.commit }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
      HISTORICAL_EXCEPTION: ${{ inputs.historical_exception }}
      POST_CLEANUP_SEAL_SHA256: ${{ inputs.post_cleanup_seal_sha256 }}
      ORDER_ARCHIVE_SEAL_SHA256: ${{ inputs.order_archive_seal_sha256 }}
      RELEASE_OPERATION: ${{ inputs.operation }}
      REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reject removed automatic registration releases
        run: |
          case "$RELEASE_OPERATION" in
            *_api_registration|*_registration_business|*_registration_handoff)
              echo 'Automatic registration has been removed; registration releases are disabled' >&2
              exit 1 ;;
          esac
          case "$HISTORICAL_EXCEPTION" in
            registration-worker-*|historical-finance-20261005-registration-continuation)
              echo 'Automatic registration has been removed; registration releases are disabled' >&2
              exit 1 ;;
          esac

      - name: Check out the requested main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify exact source and passing Quality Gate
        run: bash scripts/production-release/check-source.sh

      - name: Verify fixed maintenance continuation selection
        if: inputs.historical_exception == 'historical-finance-20261005-maintenance-continuation'
        env:
          RELEASE_OPERATION: ${{ inputs.operation }}
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = 6a82a774f2a65e00d4f260c629f7152bf7935d1d
          test -z "$REQUESTED_REUSE_IMAGE_RUN"

      - name: Verify fixed mailbox release selection
        if: inputs.historical_exception == 'historical-finance-20261005-mailbox-batch'
        env:
          RELEASE_OPERATION: ${{ inputs.operation }}
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = b8d643450ffa9012ccc09ead15e4681e3dee98d0
          test "$REQUESTED_REUSE_IMAGE_RUN" = 37312405714

      - name: Verify fixed recharge runtime approval
        if: inputs.historical_exception == 'recharge-pro-menu-b8-20261005' || inputs.historical_exception == 'recharge-pro-menu-7f-20261005' || inputs.historical_exception == 'recharge-pro-main80-20261006'
        env:
          FIXED_RECHARGE_PROFILE: ${{ inputs.historical_exception }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          case "$FIXED_RECHARGE_PROFILE" in
            recharge-pro-menu-b8-20261005) test "$EXPECTED_CURRENT" = b8d643450ffa9012ccc09ead15e4681e3dee98d0 ;;
            recharge-pro-menu-7f-20261005) test "$EXPECTED_CURRENT" = 7f70688b9bf53a071a0a324ca558aeabc4ced2e3 ;;
            recharge-pro-main80-20261006) test "$EXPECTED_CURRENT" = b91b626a71ed2c7c2473d080551b3b10b693b0cb ;;
            *) exit 1 ;;
          esac
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          python3 scripts/production-release/remote-deploy.py --check-fixed-recharge-scope --fixed-recharge-profile "$FIXED_RECHARGE_PROFILE"
      - name: Verify fixed 974 recharge runtime approval
        if: inputs.operation == 'release' && inputs.historical_exception == 'recharge-pro-974-20261007'
        env:
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = 974c62cc1681012ecff897aefc90d2cd9900004a
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          python3 scripts/production-release/remote-deploy.py --check-fixed-recharge-scope --fixed-recharge-profile recharge-pro-974-20261007
      - name: Verify fixed 2f recharge runtime approval
        if: inputs.operation == 'release' && inputs.historical_exception == 'recharge-pro-2f-20261007'
        env:
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = 2f24cf81007429ea474da404a30bc74da9d43ce1
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          python3 scripts/production-release/remote-deploy.py --check-fixed-recharge-scope --fixed-recharge-profile recharge-pro-2f-20261007
      - name: Verify fixed 4c recharge runtime approval
        if: inputs.operation == 'release' && inputs.historical_exception == 'recharge-pro-4c-20261008'
        env:
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = 4c170e661c871dc14dccc98a8d6e5cf983141341
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          test -z "${RELEASE_BROWSER_CACHE_IMAGE:-}${RELEASE_BROWSER_CACHE_IMAGE_ID:-}"
          python3 scripts/production-release/remote-deploy.py --check-fixed-recharge-scope --fixed-recharge-profile recharge-pro-4c-20261008
      - name: Verify fixed pricing e7 recharge runtime approval
        if: inputs.operation == 'release' && inputs.historical_exception == 'recharge-pro-pricing-045-20261008'
        env:
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = e7c9862d58599995954883f1c1f6038283afffab
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          test -z "${RELEASE_BROWSER_CACHE_IMAGE:-}${RELEASE_BROWSER_CACHE_IMAGE_ID:-}"
          python3 scripts/production-release/remote-deploy.py --check-fixed-recharge-scope --fixed-recharge-profile recharge-pro-pricing-045-20261008
      - name: Verify fixed 6f5 recharge runtime approval
        if: inputs.operation == 'release' && inputs.historical_exception == 'recharge-pro-6f5-20261008'
        env:
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = 6f5e5cc252886d5f86592e307147b40c13577585
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          test -z "${RELEASE_BROWSER_CACHE_IMAGE:-}${RELEASE_BROWSER_CACHE_IMAGE_ID:-}"
          python3 scripts/production-release/remote-deploy.py --check-fixed-recharge-scope --fixed-recharge-profile recharge-pro-6f5-20261008
      - name: Validate release policy and reviewed seal selection
        env:
          CACHE_PLAN_SHA256: ${{ inputs.cache_plan_sha256 }}
        run: bash scripts/production-release/validate-release-selection.sh

      - name: Verify fixed registration runtime approval
        if: inputs.historical_exception == 'registration-worker-b8-80-20261006'
        env:
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = 80bddb1a8d8fa1b5f768a146d90f2bc1fe77ac9b
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          python3 scripts/production-release/remote-deploy.py --check-fixed-registration-scope

      - name: Verify fixed 956 registration runtime approval
        if: inputs.historical_exception == 'registration-worker-956-20261006'
        env:
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = 9560d8038a39d4ded1e560d484bdcb941a5d9c43
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          python3 scripts/production-release/remote-deploy.py --check-fixed-registration-scope --registration-profile registration-worker-956-20261006

      - name: Verify fixed 85 registration runtime approval
        if: inputs.historical_exception == 'registration-worker-85-20261006'
        env:
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = 85e94572cd965dd993743d12d55a3e91d60b6444
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          python3 scripts/production-release/remote-deploy.py --check-fixed-registration-scope --registration-profile registration-worker-85-20261006

      - name: Verify fixed 86 registration runtime approval
        if: inputs.historical_exception == 'registration-worker-86-20261006'
        env:
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = fd3a6da610c505c2b7a51601cf854182991ffd12
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          python3 scripts/production-release/remote-deploy.py --check-fixed-registration-scope --registration-profile registration-worker-86-20261006

      - name: Verify fixed 87 registration runtime approval
        if: inputs.historical_exception == 'registration-worker-87-20261006'
        env:
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = 651f62902fba74ddd189b34932084573b39d245c
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          python3 scripts/production-release/remote-deploy.py --check-fixed-registration-scope --registration-profile registration-worker-87-20261006

      - name: Verify fixed 88 registration runtime approval
        if: inputs.historical_exception == 'registration-worker-88-20261006'
        env:
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = 4c200c4ae08bb8214ff8e0955f8237ce85069cc6
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          python3 scripts/production-release/remote-deploy.py --check-fixed-registration-scope --registration-profile registration-worker-88-20261006

      - name: Verify fixed 92 registration runtime approval
        if: inputs.historical_exception == 'registration-worker-92-20261007'
        env:
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = 974c62cc1681012ecff897aefc90d2cd9900004a
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          python3 scripts/production-release/remote-deploy.py --check-fixed-registration-scope --registration-profile registration-worker-92-20261007

      - name: Verify fixed 96 registration runtime approval
        if: inputs.historical_exception == 'registration-worker-96-20261008'
        env:
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = 04570d75c779fd91a0933ef9416f6d62698b6b91
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          source scripts/production-release/validate-release-selection.sh

      - name: Verify fixed 95 registration runtime approval
        if: inputs.historical_exception == 'registration-worker-95-20261008'
        env:
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = 4c170e661c871dc14dccc98a8d6e5cf983141341
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          python3 scripts/production-release/remote-deploy.py --check-fixed-registration-scope --registration-profile registration-worker-95-20261008

      - name: Verify fixed 94 registration runtime approval
        if: inputs.historical_exception == 'registration-worker-94-20261007'
        env:
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = 815fae391b172d6c368ea2ad25225f52a1272808
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          python3 scripts/production-release/remote-deploy.py --check-fixed-registration-scope --registration-profile registration-worker-94-20261007

      - name: Verify fixed 93 registration runtime approval
        if: inputs.historical_exception == 'registration-worker-93-20261007'
        env:
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = 2f24cf81007429ea474da404a30bc74da9d43ce1
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          python3 scripts/production-release/remote-deploy.py --check-fixed-registration-scope --registration-profile registration-worker-93-20261007

      - name: Verify fixed 91 registration runtime approval
        if: inputs.historical_exception == 'registration-worker-91-20261007'
        env:
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = 01cec5190b9fb48bc63c3f3eb8a4fa6f6f6345af
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          python3 scripts/production-release/remote-deploy.py --check-fixed-registration-scope --registration-profile registration-worker-91-20261007

      - name: Verify fixed 89 registration runtime approval
        if: inputs.historical_exception == 'registration-worker-89-20261006'
        env:
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = d2e22e623d0e19851c79ffe43396f5f97a99b8d3
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          python3 scripts/production-release/remote-deploy.py --check-fixed-registration-scope --registration-profile registration-worker-89-20261006

      - name: Verify fixed 90 registration runtime approval
        if: inputs.historical_exception == 'registration-worker-90-20261007'
        env:
          REQUESTED_REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: |
          set -Eeuo pipefail
          test "$RELEASE_OPERATION" = release
          test "$EXPECTED_CURRENT" = c3cad767b372738b2193e60584b0a53daa53b65f
          test -z "$REQUESTED_REUSE_IMAGE_RUN"
          python3 scripts/production-release/remote-deploy.py --check-fixed-registration-scope --registration-profile registration-worker-90-20261007

      - name: Obtain short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.RELEASE_ROLE_ARN }}
          role-session-name: id-business-v2-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Verify online recharge predecessor and idle workers before building
        if: inputs.operation == 'verify_online_recharge' || inputs.operation == 'release_online_recharge'
        run: python3 -B scripts/production-release/online-recharge-readonly.py preflight

      - name: Diagnose an online recharge predecessor failure without writes
        if: failure() && (inputs.operation == 'verify_online_recharge' || inputs.operation == 'release_online_recharge')
        run: python3 -B scripts/production-release/online-recharge-readonly.py diagnostic
      - name: Verify explicit API Workspace release selection
        if: inputs.operation == 'verify_api_workspace' || inputs.operation == 'release_api_workspace'
        env:
          CACHE_PLAN_SHA256: ${{ inputs.cache_plan_sha256 }}
          DIAGNOSTIC_COMMAND_ID: ${{ inputs.diagnostic_command_id }}
        run: bash scripts/production-release/validate-release-selection.sh

      - name: Verify API Admin baseline and idle workers before building
        if: inputs.operation == 'verify_api_workspace' || inputs.operation == 'release_api_workspace' || inputs.operation == 'verify_api_admin' || inputs.operation == 'release_api_admin' || inputs.operation == 'verify_api_admin_migration' || inputs.operation == 'release_api_admin_migration' || inputs.operation == 'verify_api_registration' || inputs.operation == 'release_api_registration'
        run: python3 -B scripts/production-release/api-admin-readonly.py preflight

      - name: Hand off the bound completed registration window once
        if: inputs.operation == 'handoff_api_registration'
        run: python3 -B scripts/production-release/api-admin-readonly.py handoff

      - name: Observe the original registration task latest attempt without writes
        if: inputs.operation == 'verify_registration_business'
        run: python3 -B scripts/production-release/api-admin-readonly.py business

      - name: Observe the bound failed registration resource handoff without writes
        if: inputs.operation == 'verify_registration_handoff'
        run: python3 -B scripts/production-release/api-admin-readonly.py handoff-observe

      - name: Recover only the bound failed registration browser resource handoff
        if: inputs.operation == 'recover_registration_handoff'
        run: python3 -B scripts/production-release/api-admin-readonly.py handoff-recover

      - name: Resolve reviewed immutable browser dependency cache
        if: inputs.operation == 'release' && inputs.reuse_image_run == '' && inputs.historical_exception != 'recharge-pro-4c-20261008' && inputs.historical_exception != 'recharge-pro-6f5-20261008' && inputs.historical_exception != 'recharge-pro-pricing-045-20261008' && (inputs.historical_exception == 'none' || startsWith(inputs.historical_exception, 'recharge-pro-'))
        run: |
          set -Eeuo pipefail
          if [[ "$HISTORICAL_EXCEPTION" == none ]]; then
            browser_cache_admin_only="$(node --input-type=module - <<'JS'
          import { execFileSync } from 'node:child_process';
          import { isAdminOnly } from './scripts/ci-recharge-scope.mjs';
          const changed = execFileSync('git', ['diff', '--name-only', process.env.EXPECTED_CURRENT, process.env.RELEASE_COMMIT], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          console.log(isAdminOnly(changed));
          JS
            )"
            case "$browser_cache_admin_only" in true) exit 0 ;; false) ;; *) exit 1 ;; esac
          fi
          python3 -B scripts/production-release/browser-cache-input.py
          registry="${RELEASE_REPOSITORY%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry" >/dev/null

      - name: Build images on the GitHub runner
        if: inputs.operation == 'release_online_recharge' || inputs.operation == 'release_api_workspace' || inputs.operation == 'release_api_admin' || inputs.operation == 'release_api_admin_migration' || inputs.operation == 'release_api_registration' || (inputs.operation == 'release' && inputs.reuse_image_run == '') || inputs.operation == 'prepare_post_cleanup_release' || inputs.operation == 'prepare_order_archive_release'
        run: bash scripts/production-release/build-images.sh

      - name: Verify reusable build and unchanged application source
        if: inputs.operation == 'release' && inputs.reuse_image_run != ''
        env:
          REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: python3 scripts/production-release/reuse-images.py

      - name: Check AWS identity and production target
        if: inputs.operation != 'prepare_post_cleanup_release' && inputs.operation != 'prepare_order_archive_release'
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Arn --output text | cut -d/ -f2)" = id-business-v2-github-release
          test "$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=${PRODUCTION_INSTANCE_ID}" --query 'InstanceInformationList[0].PingStatus' --output text)" = Online
          aws ecr describe-repositories --repository-names id-business-v2-release --query 'repositories[0].repositoryUri' --output text | grep -Fx "$RELEASE_REPOSITORY"

      - name: Verify read-only SSM command access
        if: inputs.operation != 'prepare_post_cleanup_release' && inputs.operation != 'prepare_order_archive_release'
        run: |
          set -Eeuo pipefail
          command_id="$(aws ssm send-command --instance-ids "$PRODUCTION_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["test -L /opt/id-business-v2/current && echo release_access_ok"]}' \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$PRODUCTION_INSTANCE_ID"
          test "$(aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$PRODUCTION_INSTANCE_ID" --query StandardOutputContent --output text)" = release_access_ok

      - name: Verify build-only ECR target
        if: inputs.operation == 'prepare_post_cleanup_release' || inputs.operation == 'prepare_order_archive_release'
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Arn --output text | cut -d/ -f2)" = id-business-v2-github-release
          aws ecr describe-repositories --repository-names id-business-v2-release --query 'repositories[0].repositoryUri' --output text | grep -Fx "$RELEASE_REPOSITORY"

      - name: Push immutable images
