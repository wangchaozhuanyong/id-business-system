name: Production Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify access or mailbox, clean reviewed cache, or publish the exact commit
        required: true
        default: verify_access
        type: choice
        options:
          - verify_access
          - verify_mailbox
          - verify_cache
          - cleanup_cache
          - verify_unused_cache
          - cleanup_unused_cache
          - verify_unused_legacy_cache
          - cleanup_unused_legacy_cache
          - verify_unused_builder_cache
          - cleanup_unused_builder_cache
          - verify_backups
          - cleanup_backups
          - diagnose_storage
          - cleanup_audit
          - verify_legacy_cache
          - cleanup_legacy_cache
          - release
      commit:
        description: Exact main commit to publish (40 lowercase hex characters)
        required: true
        type: string
      expected_current:
        description: Exact commit currently running in production
        required: true
        type: string
      cleanup_plan:
        description: Exact reviewed local image cache plan (cleanup operations only)
        required: true
        default: initial_20261001
        type: choice
        options:
          - initial_20261001
          - fx_subscription_20261002
          - unified_20261002
          - unified_recovery_20261002
          - recharge_names_20261002
          - recharge_execution_20261002
          - storage_20261002
          - bitbrowser_direct_20261003
      reuse_image_run:
        description: Optional completed build run to reuse after a release-control-only repair
        required: false
        default: ''
        type: string

      historical_exception:
        description: One user-approved historical finance exception; preserves original data
        required: true
        default: none
        type: choice
        options:
          - none
          - historical-finance-20261005
          - historical-finance-20261005-registration-continuation
          - historical-finance-20261005-recharge-diagnostics

      diagnostic_command_id:
        description: Optional exact failed SSM command to inspect in verify_access (UUID)
        required: false
        default: ''
        type: string

      cache_plan_sha256:
        description: Exact verified unused image cache plan digest (cleanup_unused_cache only)
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: id-business-v2-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_REGION: ap-northeast-1
      RELEASE_ROLE_ARN: arn:aws:iam::079740175286:role/id-business-v2-github-release
      RELEASE_REPOSITORY: 079740175286.dkr.ecr.ap-northeast-1.amazonaws.com/id-business-v2-release
      PRODUCTION_INSTANCE_ID: i-05836da38606e633c
      RELEASE_COMMIT: ${{ inputs.commit }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
      HISTORICAL_EXCEPTION: ${{ inputs.historical_exception }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the requested main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify exact source and passing Quality Gate
        run: bash scripts/production-release/check-source.sh

      - name: Build images on the GitHub runner
        if: inputs.operation == 'release' && inputs.reuse_image_run == ''
        run: bash scripts/production-release/build-images.sh

      - name: Verify reusable build and unchanged application source
        if: inputs.operation == 'release' && inputs.reuse_image_run != ''
        env:
          REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: python3 scripts/production-release/reuse-images.py

      - name: Obtain short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.RELEASE_ROLE_ARN }}
          role-session-name: id-business-v2-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Check AWS identity and production target
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Arn --output text | cut -d/ -f2)" = id-business-v2-github-release
          test "$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=${PRODUCTION_INSTANCE_ID}" --query 'InstanceInformationList[0].PingStatus' --output text)" = Online
          aws ecr describe-repositories --repository-names id-business-v2-release --query 'repositories[0].repositoryUri' --output text | grep -Fx "$RELEASE_REPOSITORY"

      - name: Verify read-only SSM command access
        run: |
          set -Eeuo pipefail
          command_id="$(aws ssm send-command --instance-ids "$PRODUCTION_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["test -L /opt/id-business-v2/current && echo release_access_ok"]}' \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$PRODUCTION_INSTANCE_ID"
          test "$(aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$PRODUCTION_INSTANCE_ID" --query StandardOutputContent --output text)" = release_access_ok

      - name: Push immutable images
        if: inputs.operation == 'release' && inputs.reuse_image_run == ''
        run: bash scripts/production-release/push-images.sh

      - name: Verify or apply reviewed local image cache cleanup
        if: inputs.operation == 'verify_cache' || inputs.operation == 'cleanup_cache'
        env:
          CLEANUP_OPERATION: ${{ inputs.operation }}
          CLEANUP_PLAN: ${{ inputs.cleanup_plan }}
        run: |
          set -Eeuo pipefail
          mkdir -p .deploy/production-release
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shlex
          program = Path('scripts/production-release/cleanup-reviewed-cache.py').read_text()
          plans = {
              'initial_20261001': 'deploy/aws/cache-cleanup-20261001.json',
              'fx_subscription_20261002': 'deploy/aws/cache-cleanup-fx-subscription-20261002.json',
              'unified_20261002': 'deploy/aws/cache-cleanup-unified-20261002.json',
              'unified_recovery_20261002': 'deploy/aws/cache-cleanup-unified-recovery-20261002.json',
              'recharge_names_20261002': 'deploy/aws/cache-cleanup-recharge-names-20261002.json',
              'recharge_execution_20261002': 'deploy/aws/cache-cleanup-recharge-execution-20261002.json',
              'storage_20261002': 'deploy/aws/cache-cleanup-storage-20261002.json',
              'bitbrowser_direct_20261003': 'deploy/aws/cache-cleanup-bitbrowser-direct-20261003.json',
          }
          plan = Path(plans[os.environ['CLEANUP_PLAN']]).read_text()
          parsed_plan = json.loads(plan)
          if os.environ['CLEANUP_PLAN'] not in ('unified_20261002', 'unified_recovery_20261002') and parsed_plan['expectedCurrent'] != os.environ['EXPECTED_CURRENT']:
              raise SystemExit('Cleanup expected_current differs from the reviewed plan')
          digest = hashlib.sha256(json.dumps(parsed_plan, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          command = 'python3 -c ' + shlex.quote(program) + ' --plan-json ' + shlex.quote(plan)
          if os.environ['CLEANUP_PLAN'] in ('unified_20261002', 'unified_recovery_20261002'):
              command += ' --expected-current ' + shlex.quote(os.environ['EXPECTED_CURRENT'])
          if os.environ['CLEANUP_OPERATION'] == 'cleanup_cache':
              command += ' --apply --approved-plan-sha256 ' + digest
          parameters = {'commands': [command], 'executionTimeout': ['600']}
          Path('.deploy/production-release/reviewed-cache-cleanup.json').write_text(json.dumps(parameters))
          PY
          command_id="$(aws ssm send-command --instance-ids "$PRODUCTION_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://.deploy/production-release/reviewed-cache-cleanup.json \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$PRODUCTION_INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$PRODUCTION_INSTANCE_ID" --query StandardOutputContent --output text

      - name: Verify or clean older S3-verified local backup copies
        if: inputs.operation == 'verify_backups' || inputs.operation == 'cleanup_backups'
        env:
          BACKUP_CLEANUP_OPERATION: ${{ inputs.operation }}
        run: |
          set -Eeuo pipefail
          mkdir -p .deploy/production-release
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shlex
          program = Path('scripts/production-release/cleanup-verified-backups.py').read_text()
          command = 'python3 -c ' + shlex.quote(program)
          command += ' --expected-current ' + shlex.quote(os.environ['EXPECTED_CURRENT'])
          if os.environ['BACKUP_CLEANUP_OPERATION'] == 'cleanup_backups':
              command += ' --apply'
          parameters = {'commands': [command], 'executionTimeout': ['600']}
          Path('.deploy/production-release/verified-backup-cleanup.json').write_text(json.dumps(parameters))
          PY
          command_id="$(aws ssm send-command --instance-ids "$PRODUCTION_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://.deploy/production-release/verified-backup-cleanup.json \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$PRODUCTION_INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$PRODUCTION_INSTANCE_ID" --query StandardOutputContent --output text

      - name: Diagnose storage or clean approved routine audit records
        if: inputs.operation == 'diagnose_storage' || inputs.operation == 'cleanup_audit' || inputs.operation == 'verify_legacy_cache' || inputs.operation == 'cleanup_legacy_cache'
        env:
          STORAGE_OPERATION: ${{ inputs.operation }}
        run: |
          set -Eeuo pipefail
          mkdir -p .deploy/production-release
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shlex
          operation = {'diagnose_storage': 'diagnose', 'cleanup_audit': 'cleanup-audit',
              'verify_legacy_cache': 'verify-legacy-cache', 'cleanup_legacy_cache': 'cleanup-legacy-cache'}[os.environ['STORAGE_OPERATION']]
          program = Path('scripts/production-release/storage-maintenance.py').read_text()
          command = 'python3 -c ' + shlex.quote(program) + ' --operation ' + operation
          command += ' --expected-current ' + shlex.quote(os.environ['EXPECTED_CURRENT'])
          if operation == 'cleanup-audit':
              command += ' --approved-scope audit-routine-20261002T110000Z'
              command += ' --retention-migration-sql ' + shlex.quote(Path('apps/api/prisma-mysql/migrations/20261002123500_routine_audit_retention_exception/migration.sql').read_text())
          if operation.endswith('legacy-cache'):
              command += ' --legacy-plan-json ' + shlex.quote(Path('deploy/aws/cache-cleanup-legacy-20261002.json').read_text())
          Path('.deploy/production-release/storage-maintenance.json').write_text(json.dumps({'commands': [command], 'executionTimeout': ['600']}))
          PY
          command_id="$(aws ssm send-command --instance-ids "$PRODUCTION_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://.deploy/production-release/storage-maintenance.json \
            --query 'Command.CommandId' --output text)"
          wait_status=0
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$PRODUCTION_INSTANCE_ID" || wait_status=$?
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$PRODUCTION_INSTANCE_ID" --query StandardOutputContent --output text
          exit "$wait_status"

      - name: Read requested release failure
        if: inputs.operation == 'verify_access' && inputs.diagnostic_command_id != ''
        env:
          DIAGNOSTIC_COMMAND_ID: ${{ inputs.diagnostic_command_id }}
        run: |
          set -Eeuo pipefail
          [[ "$DIAGNOSTIC_COMMAND_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "$DIAGNOSTIC_COMMAND_ID" --instance-id "$PRODUCTION_INSTANCE_ID" --output json \
            | python3 scripts/production-release/remote-deploy.py --summarize-command-result

      - name: Read production release diagnostics
        if: inputs.operation == 'verify_access'
        run: |
          set -Eeuo pipefail
          mkdir -p .deploy/production-release
          python3 - <<'PY'
          import json
          from pathlib import Path
          import shlex
          program = r'''
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import stat
          import subprocess
          PROOF_CURRENT = '6a82a774f2a65e00d4f260c629f7152bf7935d1d'
          PROOF_PREVIOUS = 'd0f359dc78b2d2b166893bfec8545609f5baa16d'
          PROOF_SERVICES = ('media-resolver', 'auto-recharge', 'auto-registration', 'api', 'admin')
          PROOF_GATE_HASHES = (
              ('before', '73f4bb876129fcb53a6ef7f31873db017b6df245372fcc2c222813018550adb6'),
              ('after', '6b3d3445796b1dfc840b8e4c0b9d31c663269847181575f3913f0c7eafabe18a'))
          def proof_fingerprint(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True,
                  separators=(',', ':')).encode()).hexdigest()
          def proof_private_bytes(path):
              descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(descriptor, 'rb') as receipt:
                  info = os.fstat(receipt.fileno())
                  if (not stat.S_ISREG(info.st_mode) or info.st_nlink != 1
                          or stat.S_IMODE(info.st_mode) not in (0o400, 0o600)
                          or info.st_size > 8 * 1024 * 1024):
                      raise RuntimeError('Read-only fixed release proof unavailable')
                  data = receipt.read(8 * 1024 * 1024 + 1)
                  after = os.fstat(receipt.fileno())
                  if (len(data) > 8 * 1024 * 1024
                          or (info.st_size, info.st_mtime_ns, info.st_ctime_ns)
                          != (after.st_size, after.st_mtime_ns, after.st_ctime_ns)):
                      raise RuntimeError('Read-only fixed release proof unavailable')
              return data
          def fixed_release_proof(directory, observed_manifest, states):
              try:
                  raw = {name: proof_private_bytes(directory / name) for name in
                      ('release-manifest.json', 'before-audit.json', 'after-audit.json')}
                  manifest = json.loads(raw['release-manifest.json'])
                  expected = {'commit': PROOF_CURRENT, 'previousCommit': PROOF_PREVIOUS,
                      'sourceTree': 'a329e268cf7afcb9967789dcb998e0177cad5ddf',
                      'releaseTag': 'v2-production-20261005T050620Z',
                      'deploymentRun': 'github-actions-37265858979-1',
                      'imageBuildRun': 'github-actions-37265858979-1',
                      'ciWorkflowRunId': 37265801532}
                  if (manifest != observed_manifest or any(manifest.get(key) != value
                          for key, value in expected.items())
                          or type(manifest.get('ciWorkflowRunId')) is not int):
                      raise RuntimeError('Read-only fixed release proof unavailable')
                  gates = {}
                  for stage, gate_hash in PROOF_GATE_HASHES:
                      report = json.loads(raw[stage + '-audit.json'])
                      gate = report['gate']
                      summary = manifest['dataAudit' + stage.title()]
                      checks = report['checks']
                      if (report.get('ok') is not False or report.get('checkCount') != 48
                              or report.get('violationCount') != 10 or len(checks) != 48
                              or any(check.get('status') != 'EXECUTED'
                                  or type(check.get('count')) is not int or check['count'] < 0
                                  for check in checks)
                              or len({check['code'] for check in checks}) != 48
                              or sum(check['count'] for check in checks) != 10
                              or summary.get('checkCount') != 48 or summary.get('violationCount') != 10
                              or summary.get('historicalException') != gate
                              or proof_fingerprint(gate) != gate_hash
                              or gate.get('accepted') is not True
                              or gate.get('policyId') != 'historical-finance-20261005-registration-continuation'
                              or gate.get('expectedCurrent') != PROOF_PREVIOUS
                              or gate.get('fixedCurrent') != PROOF_PREVIOUS or gate.get('stage') != stage
                              or gate.get('checkCount') != 48 or gate.get('executedCheckCount') != 48
                              or gate.get('unavailableCheckCount') != 0 or gate.get('violationCount') != 10):
                          raise RuntimeError('Read-only fixed release proof unavailable')
                      gates[stage] = gate
                  images = {}
                  for service in PROOF_SERVICES:
                      digest = manifest['images'][service]['digest']
                      state = states[service]
                      if (not re.fullmatch(r'sha256:[a-f0-9]{64}', digest)
                              or state.get('image') != digest or state.get('status') != 'running'
                              or state.get('health') != 'healthy'):
                          raise RuntimeError('Read-only fixed release proof unavailable')
                      images[service] = digest
                  if proof_private_bytes(directory / 'release-manifest.json') != raw['release-manifest.json']:
                      raise RuntimeError('Read-only fixed release proof unavailable')
                  return {'manifest': expected, 'manifestSha256': hashlib.sha256(raw['release-manifest.json']).hexdigest(),
                      'beforeReceiptSha256': hashlib.sha256(raw['before-audit.json']).hexdigest(),
                      'afterReceiptSha256': hashlib.sha256(raw['after-audit.json']).hexdigest(),
                      'beforeGateSha256': proof_fingerprint(gates['before']),
                      'afterGateSha256': proof_fingerprint(gates['after']),
                      'metadataSha256': gates['after']['metadataSha256'],
                      'sourcesSha256': proof_fingerprint(gates['after']['sources']),
                      'continuationSha256': proof_fingerprint(gates['after']['continuation']),
                      'checkCount': 48, 'executedCheckCount': 48, 'unavailableCheckCount': 0,
                      'violationCount': 10, 'accepted': True, 'sameManifest': True,
                      'receiptsMatchManifest': True, 'runningImagesMatchManifest': True,
                      'images': images}
              except Exception:
                  raise RuntimeError('Read-only fixed release proof unavailable') from None
          def read(*args):
              result = subprocess.run(args, capture_output=True, text=True, timeout=30)
              if result.returncode:
                  raise RuntimeError('Read-only Docker diagnostic failed')
              return result.stdout.strip()
          base = Path('/opt/id-business-v2')
          try:
              with (base / 'current' / 'release-manifest.json').open('rb') as source:
                  manifest_bytes = source.read(8 * 1024 * 1024 + 1)
              if len(manifest_bytes) > 8 * 1024 * 1024:
                  raise ValueError()
              manifest = json.loads(manifest_bytes)
              if not isinstance(manifest, dict):
                  raise ValueError()
          except Exception:
              raise SystemExit('Read-only manifest unavailable') from None
          if manifest.get('commit') == PROOF_CURRENT:
              try:
                  states = {}
                  for service in PROOF_SERVICES:
                      container = read('docker', 'compose', '--env-file', str(base / 'current' / '.env.aws.production'),
                          '-f', str(base / 'current' / 'docker-compose.aws-mysql.yml'),
                          '-f', str(base / 'current' / 'compose.release.json'), 'ps', '-q', service)
                      if not re.fullmatch(r'[a-f0-9]{12,64}', container):
                          raise ValueError()
                      fields = read('docker', 'inspect', '--format',
                          '{{.Image}} {{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}',
                          container).split()
                      if len(fields) != 3:
                          raise ValueError()
                      states[service] = dict(zip(('image', 'status', 'health'), fields))
                  proof = fixed_release_proof(base / 'current', manifest, states)
              except Exception:
                  raise SystemExit('Read-only fixed release proof unavailable') from None
              print(json.dumps({'currentCommit': PROOF_CURRENT, 'safeProof': proof}, separators=(',', ':')))
              raise SystemExit(0)
          previous_manifest = json.loads((Path(manifest['previousRelease']) / 'release-manifest.json').read_text())
          protected_image_ids = {image['digest'] for release in (manifest, previous_manifest)
              for image in release.get('images', {}).values()}
          protected_image_ids.update(manifest.get('rollback', {}).get('images', {}).values())
          usage = shutil.disk_usage(base)
          backup_files = []
          for path in sorted((base / 'backups/mysql').glob('id-business-v2-*.sql.gz')):
              if path.is_symlink():
                  continue
              try:
                  backup_files.append({'name': path.name, 'bytes': path.stat().st_size})
              except FileNotFoundError:
                  continue
          backup_summary = {'count': len(backup_files),
              'totalBytes': sum(item['bytes'] for item in backup_files), 'files': backup_files,
              'partialCount': len(list((base / 'backups/mysql').glob('.id-business-v2-*.sql.gz.partial')))}
          storage_directories = []
          for name in ('backups', 'releases', '.staging', 'logs'):
              directory = base / name
              total = 0
              if directory.is_dir() and not directory.is_symlink():
                  for root, dirs, files in os.walk(directory, followlinks=False):
                      dirs[:] = [entry for entry in dirs if not (Path(root) / entry).is_symlink()]
                      for entry in files:
                          path = Path(root) / entry
                          if not path.is_symlink():
                              try:
                                  total += path.stat().st_size
                              except FileNotFoundError:
                                  continue
              storage_directories.append({'name': name, 'fileBytes': total})
          containers = []
          for container in read('docker', 'ps', '-a', '--format', '{{.ID}}').splitlines():
              containers.append(read('docker', 'inspect', '--format',
                  '{{.Name}} {{.Image}} {{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}', container))
          protected_image_ids.update(container.split()[1] for container in containers)
          unused_images = []
          image_ids = sorted(set(read('docker', 'image', 'ls', '--no-trunc', '--quiet').splitlines()))
          if len(image_ids) > 500:
              raise RuntimeError('Read-only image inventory exceeds bound')
          image_format = ('{"id":{{json .Id}},"repoTags":{{json .RepoTags}},'
              '"repoDigests":{{json .RepoDigests}},"sizeBytes":{{json .Size}},'
              '"sourceCommit":{{json (index .Config.Labels "org.opencontainers.image.revision")}},'
              '"parent":{{json .Parent}},"created":{{json .Created}},'
              '"composeProject":{{json (index .Config.Labels "com.docker.compose.project")}}}')
          for image_id in image_ids:
              if image_id in protected_image_ids:
                  continue
              metadata = json.loads(read('docker', 'image', 'inspect', '--format', image_format, image_id))
              revision = metadata['sourceCommit'] or ''
              if len(revision) != 40 or any(char not in '0123456789abcdef' for char in revision):
                  metadata['sourceCommit'] = None
              unused_images.append(metadata)
          release_image_evidence = []
          for release in sorted((base / 'releases').glob('*/release-manifest.json')):
              if release.is_symlink():
                  continue
              old = json.loads(release.read_text())
              for service, image in old.get('images', {}).items():
                  if image.get('digest') in {item['id'] for item in unused_images}:
                      release_image_evidence.append({'imageId': image['digest'], 'service': service,
                          'commit': old.get('commit'), 'releaseTag': old.get('releaseTag')})
          repository = '079740175286.dkr.ecr.ap-northeast-1.amazonaws.com/id-business-v2-release'
          images = []
          for line in read('docker', 'image', 'ls', '--format', '{{json .}}').splitlines():
              image = json.loads(line)
              if image['Repository'] != repository or len(images) >= 20:
                  continue
              reference = repository + ':' + image['Tag']
              images.append({'tag': image['Tag'], 'size': image['Size'],
                  'metadata': read('docker', 'image', 'inspect', '--format',
                      '{{.Id}} {{.Architecture}} {{index .Config.Labels "org.opencontainers.image.revision"}}', reference)})
          print(json.dumps({'currentCommit': manifest['commit'], 'releaseTag': manifest['releaseTag'],
              'previousCommit': manifest.get('previousCommit'),
              'sourceTree': manifest.get('sourceTree'),
              'dataAuditBefore': manifest.get('dataAuditBefore'),
              'dataAuditAfter': manifest.get('dataAuditAfter'),
              'newMigrations': manifest.get('newMigrations'),
              'backupBeforeRelease': manifest.get('backupBeforeRelease'),
              'servicesUpdated': manifest.get('servicesUpdated'),
              'backups': backup_summary, 'storageDirectories': storage_directories,
              'protectedImageIds': sorted(protected_image_ids),
              'unusedLocalImages': unused_images, 'unusedImageReleaseEvidence': release_image_evidence,
              'disk': {'totalBytes': usage.total, 'usedBytes': usage.used, 'freeBytes': usage.free},
              'containers': containers, 'images': images,
              'dockerUsage': read('docker', 'system', 'df', '--format', '{{json .}}').splitlines()}))
          '''
          parameters = {'commands': ['python3 -c ' + shlex.quote(program)], 'executionTimeout': ['120']}
          Path('.deploy/production-release/readonly-diagnostics.json').write_text(json.dumps(parameters))
          PY
          command_id="$(aws ssm send-command --instance-ids "$PRODUCTION_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://.deploy/production-release/readonly-diagnostics.json \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$PRODUCTION_INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$PRODUCTION_INSTANCE_ID" --query StandardOutputContent --output text \
            > .deploy/production-release/readonly-diagnostics-result.json
          python3 -m json.tool .deploy/production-release/readonly-diagnostics-result.json

      - name: Verify fixed read-only mailbox queries in the running API
        if: inputs.operation == 'verify_mailbox'
        run: |
          set -Eeuo pipefail
          mkdir -p .deploy/production-release
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import shlex
          expected = os.environ['EXPECTED_CURRENT']
          if not re.fullmatch(r'[0-9a-f]{40}', expected):
              raise SystemExit('Invalid exact production baseline')
          node = Path('scripts/production-release/mailbox-diagnostic.mjs').read_text()
          wrapper = Path('scripts/production-release/mailbox-diagnostic.py').read_text()
          program = 'MAILBOX_PROGRAM = ' + repr(node) + '\n' + wrapper
          command = 'python3 -c ' + shlex.quote(program) + ' --expected-current ' + shlex.quote(expected)
          parameters = {'commands': [command], 'executionTimeout': ['120']}
          Path('.deploy/production-release/mailbox-diagnostics.json').write_text(json.dumps(parameters))
          PY
          command_id="$(aws ssm send-command --instance-ids "$PRODUCTION_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://.deploy/production-release/mailbox-diagnostics.json \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$PRODUCTION_INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$PRODUCTION_INSTANCE_ID" --query StandardOutputContent --output text \
            > .deploy/production-release/mailbox-diagnostics-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          namespace = {'__name__': 'mailbox_receipt_filter'}
          exec(Path('scripts/production-release/mailbox-diagnostic.py').read_text(), namespace)
          try:
              path = Path('.deploy/production-release/mailbox-diagnostics-result.json')
              namespace['require'](path.stat().st_size <= 4096, 'OUTPUT_LIMIT_EXCEEDED')
              receipt = namespace['filter_runtime_receipt'](path.read_text())
          except BaseException:
              raise SystemExit('Mailbox receipt unavailable; raw output suppressed') from None
          print(json.dumps(receipt, separators=(',', ':')))
          if receipt.get('baselineVerified') is not True:
              raise SystemExit('Mailbox production precondition failed')
          PY

      - name: Deploy through the production instance
        if: inputs.operation == 'release'
        run: bash scripts/production-release/dispatch.sh

      - name: Verify or maintain recoverable unused project image cache
        if: inputs.operation == 'verify_unused_cache' || inputs.operation == 'cleanup_unused_cache' || inputs.operation == 'verify_unused_legacy_cache' || inputs.operation == 'cleanup_unused_legacy_cache' || inputs.operation == 'verify_unused_builder_cache' || inputs.operation == 'cleanup_unused_builder_cache' || inputs.operation == 'release'
        env:
          CACHE_OPERATION: ${{ inputs.operation }}
          CACHE_PLAN_SHA256: ${{ inputs.cache_plan_sha256 }}
        run: |
          set -Eeuo pipefail
          mkdir -p .deploy/production-release
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import shlex
          operation = os.environ['CACHE_OPERATION']
          expected = os.environ['RELEASE_COMMIT'] if operation == 'release' else os.environ['EXPECTED_CURRENT']
          command = 'python3 -c ' + shlex.quote(Path('scripts/production-release/maintain-image-cache.py').read_text())
          command += ' --expected-current ' + shlex.quote(expected)
          if operation in ('verify_unused_builder_cache', 'cleanup_unused_builder_cache'):
              command += ' --legacy-builder-cache'
              if operation == 'cleanup_unused_builder_cache':
                  digest = os.environ['CACHE_PLAN_SHA256']
                  if not re.fullmatch(r'[0-9a-f]{64}', digest):
                      raise SystemExit('Exact verified builder cache plan digest required')
                  command += ' --apply --approved-policy unused-builder-cache-20261003 --approved-plan-sha256 ' + digest
          elif operation in ('verify_unused_legacy_cache', 'cleanup_unused_legacy_cache'):
              command += ' --legacy-plan-json ' + shlex.quote(Path('deploy/aws/cache-cleanup-unused-legacy-20261003.json').read_text())
              if operation == 'cleanup_unused_legacy_cache':
                  digest = os.environ['CACHE_PLAN_SHA256']
                  if not re.fullmatch(r'[0-9a-f]{64}', digest):
                      raise SystemExit('Exact verified obsolete cache plan digest required')
                  command += ' --apply --approved-policy reviewed-obsolete-project-cache-20261003 --approved-plan-sha256 ' + digest
          elif operation == 'cleanup_unused_cache':
              digest = os.environ['CACHE_PLAN_SHA256']
              if not re.fullmatch(r'[0-9a-f]{64}', digest):
                  raise SystemExit('Exact verified unused cache plan digest required')
              command += ' --apply --approved-policy current-previous-ecr-cache-v1 --approved-plan-sha256 ' + digest
          elif operation == 'release':
              deployment = 'github-actions-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
              command += ' --apply --approved-policy current-previous-ecr-cache-v1 --deployment-run ' + shlex.quote(deployment)
          parameters = {'commands': [command], 'executionTimeout': ['1200']}
          Path('.deploy/production-release/unused-image-cache.json').write_text(json.dumps(parameters))
          PY
          command_id="$(aws ssm send-command --instance-ids "$PRODUCTION_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://.deploy/production-release/unused-image-cache.json \
            --query 'Command.CommandId' --output text)"
          for attempt in $(seq 1 120); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$PRODUCTION_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                aws ssm get-command-invocation --command-id "$command_id" \
                  --instance-id "$PRODUCTION_INSTANCE_ID" --query StandardOutputContent --output text
                exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$command_id" \
                  --instance-id "$PRODUCTION_INSTANCE_ID" --query StandardOutputContent --output text
                echo 'Unused image cache maintenance failed; running release is retained' >&2
                exit 1 ;;
            esac
            sleep 10
          done
          echo 'Unused image cache maintenance timed out; running release is retained' >&2
          exit 1
