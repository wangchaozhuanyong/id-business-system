          set -Eeuo pipefail
          mkdir -p .deploy/production-release
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shlex
          program = Path('scripts/production-release/cleanup-reviewed-cache.py').read_text()
          plans = {
              'initial_20261001': 'deploy/aws/cache-cleanup-20261001.json',
              'fx_subscription_20261002': 'deploy/aws/cache-cleanup-fx-subscription-20261002.json',
              'unified_20261002': 'deploy/aws/cache-cleanup-unified-20261002.json',
              'unified_recovery_20261002': 'deploy/aws/cache-cleanup-unified-recovery-20261002.json',
              'recharge_names_20261002': 'deploy/aws/cache-cleanup-recharge-names-20261002.json',
              'recharge_execution_20261002': 'deploy/aws/cache-cleanup-recharge-execution-20261002.json',
              'storage_20261002': 'deploy/aws/cache-cleanup-storage-20261002.json',
              'bitbrowser_direct_20261003': 'deploy/aws/cache-cleanup-bitbrowser-direct-20261003.json',
          }
          plan = Path(plans[os.environ['CLEANUP_PLAN']]).read_text()
          parsed_plan = json.loads(plan)
          if os.environ['CLEANUP_PLAN'] not in ('unified_20261002', 'unified_recovery_20261002') and parsed_plan['expectedCurrent'] != os.environ['EXPECTED_CURRENT']:
              raise SystemExit('Cleanup expected_current differs from the reviewed plan')
          digest = hashlib.sha256(json.dumps(parsed_plan, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          command = 'python3 -c ' + shlex.quote(program) + ' --plan-json ' + shlex.quote(plan)
          if os.environ['CLEANUP_PLAN'] in ('unified_20261002', 'unified_recovery_20261002'):
              command += ' --expected-current ' + shlex.quote(os.environ['EXPECTED_CURRENT'])
          if os.environ['CLEANUP_OPERATION'] == 'cleanup_cache':
              command += ' --apply --approved-plan-sha256 ' + digest
          parameters = {'commands': [command], 'executionTimeout': ['600']}
          Path('.deploy/production-release/reviewed-cache-cleanup.json').write_text(json.dumps(parameters))
          PY
          command_id="$(aws ssm send-command --instance-ids "$PRODUCTION_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://.deploy/production-release/reviewed-cache-cleanup.json \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$PRODUCTION_INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$PRODUCTION_INSTANCE_ID" --query StandardOutputContent --output text

