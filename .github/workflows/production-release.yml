name: Production Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify access or mailbox, clean reviewed cache, or publish the exact commit
        required: true
        default: verify_access
        type: choice
        options:
          - verify_access
          - verify_mailbox
          - verify_cache
          - cleanup_cache
          - verify_unused_cache
          - cleanup_unused_cache
          - verify_unused_legacy_cache
          - cleanup_unused_legacy_cache
          - verify_unused_builder_cache
          - cleanup_unused_builder_cache
          - verify_backups
          - cleanup_backups
          - diagnose_storage
          - cleanup_audit
          - verify_legacy_cache
          - cleanup_legacy_cache
          - release
      commit:
        description: Exact main commit to publish (40 lowercase hex characters)
        required: true
        type: string
      expected_current:
        description: Exact commit currently running in production
        required: true
        type: string
      cleanup_plan:
        description: Exact reviewed local image cache plan (cleanup operations only)
        required: true
        default: initial_20261001
        type: choice
        options:
          - initial_20261001
          - fx_subscription_20261002
          - unified_20261002
          - unified_recovery_20261002
          - recharge_names_20261002
          - recharge_execution_20261002
          - storage_20261002
          - bitbrowser_direct_20261003
      reuse_image_run:
        description: Optional completed build run to reuse after a release-control-only repair
        required: false
        default: ''
        type: string

      historical_exception:
        description: One user-approved historical finance exception; preserves original data
        required: true
        default: none
        type: choice
        options:
          - none
          - historical-finance-20261005
          - historical-finance-20261005-registration-continuation
          - historical-finance-20261005-recharge-diagnostics

      diagnostic_command_id:
        description: Optional exact failed SSM command to inspect in verify_access (UUID)
        required: false
        default: ''
        type: string

      cache_plan_sha256:
        description: Exact verified unused image cache plan digest (cleanup_unused_cache only)
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: id-business-v2-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_REGION: ap-northeast-1
      RELEASE_ROLE_ARN: arn:aws:iam::079740175286:role/id-business-v2-github-release
      RELEASE_REPOSITORY: 079740175286.dkr.ecr.ap-northeast-1.amazonaws.com/id-business-v2-release
      PRODUCTION_INSTANCE_ID: i-05836da38606e633c
      RELEASE_COMMIT: ${{ inputs.commit }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
      HISTORICAL_EXCEPTION: ${{ inputs.historical_exception }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the requested main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify exact source and passing Quality Gate
        run: bash scripts/production-release/check-source.sh

      - name: Build images on the GitHub runner
        if: inputs.operation == 'release' && inputs.reuse_image_run == ''
        run: bash scripts/production-release/build-images.sh

      - name: Verify reusable build and unchanged application source
        if: inputs.operation == 'release' && inputs.reuse_image_run != ''
        env:
          REUSE_IMAGE_RUN: ${{ inputs.reuse_image_run }}
        run: python3 scripts/production-release/reuse-images.py

      - name: Obtain short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.RELEASE_ROLE_ARN }}
          role-session-name: id-business-v2-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Check AWS identity and production target
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Arn --output text | cut -d/ -f2)" = id-business-v2-github-release
          test "$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=${PRODUCTION_INSTANCE_ID}" --query 'InstanceInformationList[0].PingStatus' --output text)" = Online
          aws ecr describe-repositories --repository-names id-business-v2-release --query 'repositories[0].repositoryUri' --output text | grep -Fx "$RELEASE_REPOSITORY"

      - name: Verify read-only SSM command access
        run: |
          set -Eeuo pipefail
          command_id="$(aws ssm send-command --instance-ids "$PRODUCTION_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["test -L /opt/id-business-v2/current && echo release_access_ok"]}' \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$PRODUCTION_INSTANCE_ID"
          test "$(aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$PRODUCTION_INSTANCE_ID" --query StandardOutputContent --output text)" = release_access_ok

      - name: Push immutable images
        if: inputs.operation == 'release' && inputs.reuse_image_run == ''
        run: bash scripts/production-release/push-images.sh

      - name: Verify or apply reviewed local image cache cleanup
        if: inputs.operation == 'verify_cache' || inputs.operation == 'cleanup_cache'
        env:
          CLEANUP_OPERATION: ${{ inputs.operation }}
          CLEANUP_PLAN: ${{ inputs.cleanup_plan }}
        run: |
          set -Eeuo pipefail
          mkdir -p .deploy/production-release
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shlex
          program = Path('scripts/production-release/cleanup-reviewed-cache.py').read_text()
          plans = {
              'initial_20261001': 'deploy/aws/cache-cleanup-20261001.json',
              'fx_subscription_20261002': 'deploy/aws/cache-cleanup-fx-subscription-20261002.json',
              'unified_20261002': 'deploy/aws/cache-cleanup-unified-20261002.json',
              'unified_recovery_20261002': 'deploy/aws/cache-cleanup-unified-recovery-20261002.json',
              'recharge_names_20261002': 'deploy/aws/cache-cleanup-recharge-names-20261002.json',
              'recharge_execution_20261002': 'deploy/aws/cache-cleanup-recharge-execution-20261002.json',
              'storage_20261002': 'deploy/aws/cache-cleanup-storage-20261002.json',
              'bitbrowser_direct_20261003': 'deploy/aws/cache-cleanup-bitbrowser-direct-20261003.json',
          }
          plan = Path(plans[os.environ['CLEANUP_PLAN']]).read_text()
          parsed_plan = json.loads(plan)
          if os.environ['CLEANUP_PLAN'] not in ('unified_20261002', 'unified_recovery_20261002') and parsed_plan['expectedCurrent'] != os.environ['EXPECTED_CURRENT']:
              raise SystemExit('Cleanup expected_current differs from the reviewed plan')
          digest = hashlib.sha256(json.dumps(parsed_plan, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          command = 'python3 -c ' + shlex.quote(program) + ' --plan-json ' + shlex.quote(plan)
          if os.environ['CLEANUP_PLAN'] in ('unified_20261002', 'unified_recovery_20261002'):
              command += ' --expected-current ' + shlex.quote(os.environ['EXPECTED_CURRENT'])
          if os.environ['CLEANUP_OPERATION'] == 'cleanup_cache':
              command += ' --apply --approved-plan-sha256 ' + digest
          parameters = {'commands': [command], 'executionTimeout': ['600']}
          Path('.deploy/production-release/reviewed-cache-cleanup.json').write_text(json.dumps(parameters))
          PY
          command_id="$(aws ssm send-command --instance-ids "$PRODUCTION_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://.deploy/production-release/reviewed-cache-cleanup.json \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$PRODUCTION_INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$PRODUCTION_INSTANCE_ID" --query StandardOutputContent --output text

      - name: Verify or clean older S3-verified local backup copies
        if: inputs.operation == 'verify_backups' || inputs.operation == 'cleanup_backups'
        env:
          BACKUP_CLEANUP_OPERATION: ${{ inputs.operation }}
        run: |
          set -Eeuo pipefail
          mkdir -p .deploy/production-release
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shlex
          program = Path('scripts/production-release/cleanup-verified-backups.py').read_text()
          command = 'python3 -c ' + shlex.quote(program)
          command += ' --expected-current ' + shlex.quote(os.environ['EXPECTED_CURRENT'])
          if os.environ['BACKUP_CLEANUP_OPERATION'] == 'cleanup_backups':
              command += ' --apply'
          parameters = {'commands': [command], 'executionTimeout': ['600']}
          Path('.deploy/production-release/verified-backup-cleanup.json').write_text(json.dumps(parameters))
          PY
          command_id="$(aws ssm send-command --instance-ids "$PRODUCTION_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://.deploy/production-release/verified-backup-cleanup.json \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$PRODUCTION_INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$PRODUCTION_INSTANCE_ID" --query StandardOutputContent --output text

      - name: Diagnose storage or clean approved routine audit records
        if: inputs.operation == 'diagnose_storage' || inputs.operation == 'cleanup_audit' || inputs.operation == 'verify_legacy_cache' || inputs.operation == 'cleanup_legacy_cache'
        env:
          STORAGE_OPERATION: ${{ inputs.operation }}
        run: |
          set -Eeuo pipefail
          mkdir -p .deploy/production-release
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shlex
          operation = {'diagnose_storage': 'diagnose', 'cleanup_audit': 'cleanup-audit',
              'verify_legacy_cache': 'verify-legacy-cache', 'cleanup_legacy_cache': 'cleanup-legacy-cache'}[os.environ['STORAGE_OPERATION']]
          program = Path('scripts/production-release/storage-maintenance.py').read_text()
          command = 'python3 -c ' + shlex.quote(program) + ' --operation ' + operation
          command += ' --expected-current ' + shlex.quote(os.environ['EXPECTED_CURRENT'])
          if operation == 'cleanup-audit':
              command += ' --approved-scope audit-routine-20261002T110000Z'
              command += ' --retention-migration-sql ' + shlex.quote(Path('apps/api/prisma-mysql/migrations/20261002123500_routine_audit_retention_exception/migration.sql').read_text())
          if operation.endswith('legacy-cache'):
              command += ' --legacy-plan-json ' + shlex.quote(Path('deploy/aws/cache-cleanup-legacy-20261002.json').read_text())
          Path('.deploy/production-release/storage-maintenance.json').write_text(json.dumps({'commands': [command], 'executionTimeout': ['600']}))
          PY
          command_id="$(aws ssm send-command --instance-ids "$PRODUCTION_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://.deploy/production-release/storage-maintenance.json \
            --query 'Command.CommandId' --output text)"
          wait_status=0
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$PRODUCTION_INSTANCE_ID" || wait_status=$?
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$PRODUCTION_INSTANCE_ID" --query StandardOutputContent --output text
          exit "$wait_status"

      - name: Read requested release failure
        if: inputs.operation == 'verify_access' && inputs.diagnostic_command_id != ''
        env:
          DIAGNOSTIC_COMMAND_ID: ${{ inputs.diagnostic_command_id }}
        run: |
          set -Eeuo pipefail
          [[ "$DIAGNOSTIC_COMMAND_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "$DIAGNOSTIC_COMMAND_ID" --instance-id "$PRODUCTION_INSTANCE_ID" --output json \
            | python3 scripts/production-release/remote-deploy.py --summarize-command-result

      - name: Read production release diagnostics
        if: inputs.operation == 'verify_access'
        run: |
          set -Eeuo pipefail
          mkdir -p .deploy/production-release
          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path
          import shlex
          program = r'''
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import stat
          import subprocess
          PROOF_CURRENT = '6a82a774f2a65e00d4f260c629f7152bf7935d1d'
          PROOF_PREVIOUS = 'd0f359dc78b2d2b166893bfec8545609f5baa16d'
          PROOF_SERVICES = ('media-resolver', 'auto-recharge', 'auto-registration', 'api', 'admin')
          PROOF_GATE_HASHES = (
              ('before', '73f4bb876129fcb53a6ef7f31873db017b6df245372fcc2c222813018550adb6'),
              ('after', '6b3d3445796b1dfc840b8e4c0b9d31c663269847181575f3913f0c7eafabe18a'))
          PROOF_RECEIPT = {
              'manifest': {'commit': PROOF_CURRENT, 'previousCommit': PROOF_PREVIOUS,
                  'sourceTree': 'a329e268cf7afcb9967789dcb998e0177cad5ddf',
                  'releaseTag': 'v2-production-20261005T050620Z',
                  'deploymentRun': 'github-actions-37265858979-1', 'imageBuildRun': 'github-actions-37265858979-1',
                  'ciWorkflowRunId': 37265801532},
              'manifestSha256': '202262260aca06d9c2d613e9b3ed1e7e6dc9d41d02e6834560e44488dfb33866',
              'beforeReceiptSha256': 'b54520e73edffbc0a9fcf6592da3733b04564c5b65ff41f1ed8789ea782804d5',
              'afterReceiptSha256': '818e1980ab01bff0eafaca24863601bca8b02aa0e4bcadf64c3a671bc38edf63',
              'beforeGateSha256': PROOF_GATE_HASHES[0][1], 'afterGateSha256': PROOF_GATE_HASHES[1][1],
              'metadataSha256': 'b1648d5e5f832b0c540e88ea1ca4117eee664d8e6d84d06dca90d2ea0e146a6e',
              'sourcesSha256': 'db943f1852946a475b43940cd6db62abcc4e78b7a8345f141633106a1399d884',
              'continuationSha256': '5762fb16f9787ca1c3bcb255a31e50188dc868de66bbaee8768cab8945cb21ba',
              'checkCount': 48, 'executedCheckCount': 48, 'unavailableCheckCount': 0, 'violationCount': 10,
              'accepted': True, 'sameManifest': True, 'receiptsMatchManifest': True, 'runningImagesMatchManifest': True,
              'images': {
                  'media-resolver': 'sha256:61d025286e67173385b691e36c8469d5aa556feb28667dafcec64b527b00f046',
                  'auto-recharge': 'sha256:52ba677bcc7e9c638458fa4d1d57ba64982181c27b838852535d97ad90b46ed3',
                  'auto-registration': 'sha256:52ba677bcc7e9c638458fa4d1d57ba64982181c27b838852535d97ad90b46ed3',
                  'api': 'sha256:cb4527113166284592b0217b1916af0cf378a920d15fd815db774583ce152f51',
                  'admin': 'sha256:8c2c3578b28e4826dcd06fbfb2aedd8956d933d5a3d396bd75ea0f07c8a08827'}}
          PROOF_HISTORY_BASELINES = {
              'historical-finance-20261005': 'ed2f75b0f4075347224ce3b2c82a90ed514d8d22',
              'historical-finance-20261005-registration-continuation': PROOF_PREVIOUS,
              'historical-finance-20261005-recharge-diagnostics': PROOF_CURRENT}
          PROOF_CONTINUATIONS = {
              'historical-finance-20261005-registration-continuation': PROOF_RECEIPT['continuationSha256'],
              'historical-finance-20261005-recharge-diagnostics':
                  '5412e83e9702c09d2e070e98b7eb4256dfd8cfbbf4be6bf09e3f13202a2bb670'}
          PROOF_FAILURES = ('MANIFEST_UNAVAILABLE', 'FIXED_PROOF_UNAVAILABLE',
              'DOCKER_DIAGNOSTIC_FAILED', 'IMAGE_INVENTORY_BOUND')
          def release_lock_summary(lock_path=Path('/opt/id-business-v2/.deploy.lock'), proc=Path('/proc')):
              unknown = {'status': 'NOT_MEASURED', 'holders': []}
              flags = os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK
              def bounded(path, limit):
                  with os.fdopen(os.open(path, flags), 'rb') as source:
                      if not stat.S_ISREG(os.fstat(source.fileno()).st_mode):
                          raise ValueError()
                      data = source.read(limit + 1)
                      if len(data) > limit:
                          raise ValueError()
                      return data
              def identity(info):
                  return (info.st_dev, info.st_ino, info.st_mode, info.st_nlink)
              def snapshot(info):
                  entries = []
                  for line in bounded(proc / 'locks', 256 * 1024).decode('ascii').splitlines():
                      fields = line.split()
                      waiting = len(fields) > 1 and fields[1] == '->'
                      if waiting:
                          fields.pop(1)
                      if (len(fields) != 8 or not re.fullmatch(r'[0-9]+:', fields[0])
                              or fields[1] not in ('FLOCK', 'POSIX', 'OFDLCK')
                              or fields[2] not in ('ADVISORY', 'MANDATORY')
                              or fields[3] not in ('READ', 'WRITE')
                              or not re.fullmatch(r'-?[0-9]+', fields[4])
                              or not re.fullmatch(r'[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9]+', fields[5])
                              or not fields[6].isdigit()
                              or not (fields[7].isdigit() or fields[7] == 'EOF')):
                          raise ValueError()
                      major, minor, inode = fields[5].split(':')
                      if (not waiting and (int(major, 16), int(minor, 16), int(inode))
                              == (os.major(info.st_dev), os.minor(info.st_dev), info.st_ino)):
                          pid = int(fields[4])
                          if (pid > 2 ** 31 - 1 or pid <= 0 and not (fields[1] == 'OFDLCK' and pid == -1)):
                              raise ValueError()
                          entries.append((fields[1], fields[3], pid))
                  if len(entries) > 16:
                      raise ValueError()
                  return sorted(entries)
              def process(pid):
                  data = bounded(proc / str(pid) / 'stat', 4096).decode('ascii').strip()
                  head, tail = data.rsplit(') ', 1)
                  prefix = str(pid) + ' ('
                  fields = tail.split()
                  if (not head.startswith(prefix) or len(fields) < 20
                          or fields[0] not in ('R', 'S', 'D', 'Z', 'T', 't', 'W', 'X', 'x', 'I', 'K', 'P')
                          or not fields[19].isdigit() or not fields[1].isdigit()
                          or int(fields[1]) > 2 ** 31 - 1):
                      raise ValueError()
                  comm = head[len(prefix):]
                  if not (re.fullmatch(r'python(?:3(?:\.[0-9]{1,2})?)?', comm)
                          or comm in ('bash', 'sh', 'flock', 'node', 'ssm-agent-worke', 'amazon-ssm-agen')):
                      comm = 'OTHER'
                  return comm, fields[0], int(fields[19]), int(fields[1])
              def invocation(pid):
                  # Stop at the second NUL; never read inline source or later arguments.
                  with os.fdopen(os.open(proc / str(pid) / 'cmdline', flags), 'rb') as source:
                      if not stat.S_ISREG(os.fstat(source.fileno()).st_mode):
                          raise ValueError()
                      data = b''
                      for _ in range(512):
                          byte = os.read(source.fileno(), 1)
                          if not byte:
                              break
                          data += byte
                          if data.count(b'\0') == 2:
                              break
                  if data.count(b'\0') != 2:
                      return 'UNKNOWN'
                  first, second = data.split(b'\0')[:2]
                  if re.fullmatch(rb'(?:/usr/(?:local/)?bin/)?python3(?:\.[0-9]{1,2})?', first):
                      if second == b'-c':
                          return 'PYTHON_INLINE'
                      if second == b'-':
                          return 'PYTHON_STDIN'
                      if re.fullmatch(rb'/opt/id-business-v2/\.staging/oidc-[a-f0-9]{40}/remote-deploy\.py', second):
                          return 'REMOTE_DEPLOY'
                  if second == b'-c' and first in (b'sh', b'bash', b'/bin/sh', b'/bin/bash'):
                      return 'SHELL_INLINE'
                  return 'UNKNOWN'
              def location(pid):
                  try:
                      cwd = os.readlink(proc / str(pid) / 'cwd')
                      if len(cwd) > 4096:
                          raise ValueError()
                      ssm = re.fullmatch(r'/var/lib/amazon/ssm/i-[0-9a-f]{8,17}/document/orchestration/'
                          r'([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/'
                          r'awsrunShellScript/0\.awsrunShellScript', cwd)
                      if ssm:
                          return 'SSM_ORCHESTRATION', ssm.group(1)
                      if cwd == '/opt/id-business-v2' or cwd.startswith('/opt/id-business-v2/'):
                          return 'PROJECT', None
                      return 'OTHER', None
                  except Exception:
                      return 'NOT_MEASURED', None
              try:
                  with os.fdopen(os.open(lock_path, flags), 'rb') as lock:
                      info = os.fstat(lock.fileno())
                      if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1:
                          raise ValueError()
                      entries = snapshot(info)
                      holders = []
                      if entries:
                          uptime = bounded(proc / 'uptime', 128).decode('ascii').split()[0]
                          if not re.fullmatch(r'[0-9]+(?:\.[0-9]+)?', uptime):
                              raise ValueError()
                          ticks = os.sysconf('SC_CLK_TCK')
                          if ticks <= 0:
                              raise ValueError()
                      for kind, mode, pid in entries:
                          holder = {'kind': kind, 'mode': mode, 'pid': pid if pid > 0 else None,
                              'comm': 'NOT_MEASURED', 'state': 'NOT_MEASURED', 'elapsedSeconds': None,
                              'script': 'UNKNOWN', 'cwd': 'NOT_MEASURED', 'commandUuid': None,
                              'parent': {'pid': None, 'comm': 'NOT_MEASURED', 'state': 'NOT_MEASURED'}}
                          if pid > 0:
                              comm, state, started, parent_pid = process(pid)
                              script = invocation(pid)
                              cwd, command_uuid = location(pid)
                              parent = {'pid': None, 'comm': 'NOT_MEASURED', 'state': 'NOT_MEASURED'}
                              if parent_pid > 0:
                                  try:
                                      parent_comm, parent_state, parent_started, _parent = process(parent_pid)
                                      if process(parent_pid)[::2] != (parent_comm, parent_started):
                                          raise ValueError()
                                      parent.update(pid=parent_pid, comm=parent_comm, state=parent_state)
                                  except Exception:
                                      pass
                              # Process age; /proc/locks has no acquisition timestamp.
                              elapsed = int(float(uptime) - started / ticks)
                              final_comm, _state, final_started, final_parent_pid = process(pid)
                              if (elapsed < 0 or elapsed > 2 ** 31 - 1
                                      or (final_comm, final_started, final_parent_pid) != (comm, started, parent_pid)):
                                  raise ValueError()
                              holder.update(comm=comm, state=state, elapsedSeconds=elapsed, script=script,
                                  cwd=cwd, commandUuid=command_uuid, parent=parent)
                          holders.append(holder)
                      if (snapshot(info) != entries or identity(os.fstat(lock.fileno())) != identity(info)
                              or identity(os.stat(lock_path, follow_symlinks=False)) != identity(info)):
                          raise ValueError()
                      return {'status': 'HELD' if holders else 'UNLOCKED', 'holders': holders}
              except Exception:
                  return unknown
          def project_readonly_diagnostics(value, closed=True):
              keys = {'currentCommit', 'releaseTag', 'sourceTree', 'previousCommit', 'servicesUpdated',
                  'newMigrations', 'backupBeforeRelease', 'dataAuditBefore', 'dataAuditAfter', 'services'}
              if not isinstance(value, dict) or closed and set(value) != keys:
                  raise ValueError()
              def matches(pattern, text):
                  return isinstance(text, str) and re.fullmatch(pattern, text) is not None
