name: Recharge Record Repair Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed main commit
        required: true
        type: string
      expected_current:
        description: Exact deployed predecessor commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: id-business-v2-production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit
      - name: Verify publication controls
        run: |
          python3 -B scripts/production-release/recharge-record-release.test.py
          node --test scripts/ci-recharge-record.test.mjs
      - name: Prepare exact published source and diagnostic overlay
        run: python3 -B scripts/production-release/recharge-record-build.py prepare
      - name: Verify diagnostic and preserved form behavior
        working-directory: .deploy/recharge-record-release/candidate
        run: |
          npm run test --workspace apps/admin -- src/v2/features/auto-recharge/recharge-presentation.spec.ts src/v2/features/auto-recharge/useAutoRecharge.spec.ts src/v2/features/auto-recharge/useRechargeProxyRegion.spec.ts src/v2/features/auto-recharge/useRechargeNameMatch.spec.ts
          npm run test --workspace apps/api -- src/id-business-v2/auto-recharge/recharge.spec.ts src/id-business-v2/auto-recharge/recharge-callback-receipts.spec.ts
      - name: Verify UI and application boundaries
        working-directory: .deploy/recharge-record-release/candidate
        run: |
          npm run check:admin-ui
          npm run check:v2-ui-language
          npm run check:v2-color-contrast
          npm run check:v2-table-standard
          npm run check:v2-loading-standard
          npm run check:v2-module-architecture
          npm run check:v2-isolation
      - name: Verify connector without starting it
        working-directory: .deploy/recharge-record-release/candidate/apps/api/src/id-business-v2/auto-recharge/worker
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements.lock.txt
          python3 -B -m unittest test_callback_observation test_bitbrowser_connector
      - name: Build repair and independently reproduce live baseline
        run: python3 -B scripts/production-release/recharge-record-build.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recharge-record-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .deploy/recharge-record-release/recharge-record-artifact.tar.gz
            .deploy/recharge-record-release/artifact-sha256.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_REGION: ap-northeast-1
      RELEASE_COMMIT: ${{ inputs.commit }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Configure existing production OIDC role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::079740175286:role/id-business-v2-github-release
          role-session-name: id-business-v2-record-${{ github.run_id }}
          aws-region: ap-northeast-1
          role-duration-seconds: 3600
      - name: Publish once and independently read back
        run: python3 -B scripts/production-release/recharge-record-dispatch.py
      - name: Preserve native publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recharge-record-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/recharge-record-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
