name: Dependency Security Publication

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only capture or reviewed dependency publication
        required: true
        default: capture
        type: choice
        options: [capture, publish]
      commit:
        description: Exact reviewed main commit
        required: true
        type: string
      expected_current:
        description: Exact deployed predecessor
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: id-business-v2-production-release
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha && inputs.mode == 'capture'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Verify finite dependency capture
        run: |
          python3 -B scripts/production-release/dependency-security-publication.py check
          python3 -B scripts/production-release/dependency-security-publication.test.py
      - name: Configure existing production observation role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::098208446664:role/id-business-v2-github-release
          role-session-name: id-business-v2-dependency-observe-${{ github.run_id }}
          aws-region: ap-northeast-1
      - name: Capture the exact deployed dependency baseline without writes
        run: python3 -B scripts/production-release/dependency-security-publication.py capture
      - name: Preserve credential-free observation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-security-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/dependency-security/*.json
          include-hidden-files: true
          if-no-files-found: warn

  validate:
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha && inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Verify exact scope, native baseline, and forward-only controls
        run: |
          python3 -B scripts/production-release/dependency-security-deploy.py check
          python3 -B scripts/production-release/dependency-security-publication.test.py
          python3 -B scripts/production-release/dependency-security-runtime.test.py
      - name: Build reviewed dependencies from this main commit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:dependency-security
          python3 -B scripts/production-release/dependency-security-deploy.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-security-native-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .deploy/dependency-security/dependency-security-artifact.tar.gz
            .deploy/dependency-security/artifact-sha256.txt
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha && inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::098208446664:role/id-business-v2-github-release
          role-session-name: id-business-v2-dependency-publish-${{ github.run_id }}
          aws-region: ap-northeast-1
      - name: Publish only the API dependency layer and independently read back
        run: python3 -B scripts/production-release/dependency-security-deploy.py publish
      - name: Preserve native publication and readback receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-security-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/dependency-security/*.*
          include-hidden-files: true
          if-no-files-found: warn
