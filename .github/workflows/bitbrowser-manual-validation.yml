name: BitBrowser Manual Settlement and Connections Patched Finite Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed main commit
        required: true
        type: string
      expected_current:
        description: Exact deployed predecessor commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: id-business-v2-production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Verify frozen sources and release protections
        run: |
          python3 -B scripts/production-release/bitbrowser-manual-build.py --check
          python3 -B scripts/production-release/bitbrowser-manual-release.test.py
      - name: Configure existing OIDC role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::098208446664:role/id-business-v2-github-release
          role-session-name: id-business-v2-manual-parent-${{ github.run_id }}
          aws-region: ap-northeast-1
          role-duration-seconds: 3600
      - name: Authenticate native financial acceptance and build finite overlay
        run: python3 -B scripts/production-release/bitbrowser-manual-build.py
      - name: Preserve native parent receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitbrowser-manual-parent-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/bitbrowser-manual-parent/
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitbrowser-history-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .deploy/bitbrowser-manual/bitbrowser-history-artifact.tar.gz
            .deploy/bitbrowser-manual/artifact-sha256.txt
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
      AWS_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Configure existing production OIDC role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::098208446664:role/id-business-v2-github-release
          role-session-name: id-business-v2-manual-${{ github.run_id }}
          aws-region: ap-northeast-1
          role-duration-seconds: 3600
      - name: Publish once and independently read back
        run: python3 -B scripts/production-release/bitbrowser-manual-dispatch.py
      - name: Preserve publication receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitbrowser-manual-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/bitbrowser-manual-publication/
          include-hidden-files: true
          if-no-files-found: error
