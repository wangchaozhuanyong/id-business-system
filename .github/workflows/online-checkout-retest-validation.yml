name: Online Checkout Retest Validation

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: id-business-v2-production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm run prisma:mysql:generate && npm run build --workspace @apple-business/shared
      - name: Verify protected publication and affected API behavior
        run: |
          python3 -B scripts/production-release/online-checkout-release.test.py
          python3 -B scripts/production-release/online-checkout-retest-release.test.py
          npm run typecheck --workspace @apple-business/api
          npm run test --workspace @apple-business/api -- src/id-business-v2/online-recharge/validation.spec.ts src/id-business-v2/online-recharge/persistence/worker.repository.spec.ts src/id-business-v2/online-recharge/persistence/admin.repository.spec.ts src/id-business-v2/online-recharge/vendure-integration.spec.ts src/id-business-v2/online-recharge/worker-body-parser.spec.ts src/id-business-v2/bank-card-pool/shared-bank-card.spec.ts
      - name: Verify actual Chromium form and existing engine regressions
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb xauth
          npm ci --prefix apps/api/src/id-business-v2/online-recharge/engine/upstream --ignore-scripts --no-audit --no-fund
          npx --prefix apps/api/src/id-business-v2/online-recharge/engine/upstream playwright install --with-deps chromium
          npm run test:online-recharge:engine
      - name: Verify task progress lifecycle
        run: |
          npm run test --workspace @apple-business/admin -- src/v2/features/online-recharge
          npm run typecheck --workspace @apple-business/admin
      - name: Verify management interface rules
        run: |
          npm run check:admin-ui
          npm run check:v2-ui-language
          npm run check:v2-color-contrast
          npm run check:v2-table-standard
          npm run check:v2-loading-standard
          npm run check:v2-module-architecture
          npm run check:v2-isolation
      - name: Reproduce current three roles and build only this repair
        run: python3 -B scripts/production-release/online-checkout-retest-build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: online-checkout-retest-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .deploy/online-checkout-retest/online-checkout-artifact.tar.gz
            .deploy/online-checkout-retest/artifact-sha256.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
